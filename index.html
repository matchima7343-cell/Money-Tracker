<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07120e">
  <title>MONEY-TRACK · Christmas Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   MONEY-TRACK Design System Tokens — Luxury Christmas Gold Glass Edition
   Midnight Starlight & Royal Gold (Dark) · Frosted Snow & Champagne Gold (Light)
   ========================================================================== */

:root,
[data-theme="dark"] {
  color-scheme: dark;

  /* Typography */
  --font-sans: "IBM Plex Sans Thai", "Plus Jakarta Sans", "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --font-display: "Plus Jakarta Sans", "IBM Plex Sans Thai", "Inter", system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  /* Midnight Starlight Glass Surfaces (Harmonized with Snowman & Golden Moon) */
  --bg-canvas: #07111a;
  --bg-surface: rgba(10, 20, 31, 0.72);
  --bg-surface-2: rgba(15, 30, 45, 0.76);
  --bg-surface-3: rgba(23, 44, 64, 0.84);
  --bg-elevated: rgba(13, 25, 38, 0.90);
  --bg-glass: rgba(8, 17, 27, 0.78);
  --bg-hover: rgba(245, 198, 92, 0.10);
  --bg-active: rgba(245, 198, 92, 0.16);

  /* Luxury Gold Borders */
  --border-subtle: rgba(245, 198, 92, 0.20);
  --border-default: rgba(245, 198, 92, 0.34);
  --border-strong: rgba(253, 230, 138, 0.56);

  /* High-Contrast Text */
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --text-inverse: #ffffff;

  /* Luxury Christmas Gold & Crimson Brand Palette */
  --accent: #c81e3a;
  --accent-hover: #e11d48;
  --accent-soft: rgba(200, 30, 58, 0.22);
  --accent-text: #fda4af;

  --xmas-gold: #f5c65c;
  --xmas-gold-strong: #d49b27;
  --xmas-gold-soft: rgba(245, 198, 92, 0.18);
  --xmas-gold-text: #fde68a;
  --gold-gradient: linear-gradient(135deg, #fde68a 0%, #f5c65c 45%, #c98a1c 100%);
  --xmas-pine: #15803d;
  --xmas-pine-soft: rgba(21, 128, 61, 0.26);

  /* Semantic Finance Palette (Razor-Sharp Numbers over Glass) */
  --color-income: #10b981;
  --income-soft: rgba(16, 185, 129, 0.18);
  --income-text: #4ade80;

  --color-expense: #f43f5e;
  --expense-soft: rgba(244, 63, 94, 0.18);
  --expense-text: #fb7185;

  --color-savings: #818cf8;
  --savings-soft: rgba(129, 140, 248, 0.18);
  --savings-text: #c7d2fe;

  --color-transfer: #f5c65c;
  --transfer-soft: rgba(245, 198, 92, 0.18);
  --transfer-text: #fde68a;

  /* Status Aliases */
  --color-info: #f5c65c;
  --info-soft: rgba(245, 198, 92, 0.16);
  --info-text: #fde68a;

  --color-success: #10b981;
  --success-soft: rgba(16, 185, 129, 0.18);
  --success-text: #4ade80;

  --color-warning: #f59e0b;
  --warning-soft: rgba(245, 158, 11, 0.18);
  --warning-text: #fcd34d;

  --color-danger: #f43f5e;
  --danger-soft: rgba(244, 63, 94, 0.18);
  --danger-text: #fb7185;

  /* Luxury Shadows & Gold Glow */
  --shadow-xs: 0 2px 6px rgba(2, 6, 14, 0.42);
  --shadow-sm: 0 6px 18px rgba(2, 6, 14, 0.46), 0 0 0 1px rgba(245, 198, 92, 0.06);
  --shadow-md: 0 14px 36px rgba(2, 6, 14, 0.56), 0 0 24px rgba(245, 198, 92, 0.07);
  --shadow-lg: 0 24px 60px rgba(2, 6, 14, 0.72), 0 0 36px rgba(245, 198, 92, 0.12);

  /* Radii */
  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-pill: 9999px;

  /* Layout Dimensions */
  --sidebar-w: 256px;
  --topbar-h: 64px;
  --bottom-nav-h: 64px;
  --content-max-w: 1280px;

  /* Motion */
  --transition-fast: 140ms cubic-bezier(0.2, 0, 0, 1);
  --transition-base: 220ms cubic-bezier(0.2, 0, 0, 1);

  /* Layering */
  --z-topbar: 20;
  --z-bottom-nav: 30;
  --z-backdrop: 35;
  --z-sidebar: 40;
  --z-modal: 60;
  --z-tooltip: 70;
  --z-toast: 80;
}

[data-theme="light"] {
  color-scheme: light;

  /* Frosted Snow & Champagne Gold Glass Surfaces */
  --bg-canvas: #f7f2e7;
  --bg-surface: rgba(255, 252, 245, 0.82);
  --bg-surface-2: rgba(248, 241, 226, 0.84);
  --bg-surface-3: rgba(236, 225, 202, 0.90);
  --bg-elevated: rgba(255, 253, 249, 0.95);
  --bg-glass: rgba(255, 251, 242, 0.84);
  --bg-hover: rgba(180, 120, 20, 0.08);
  --bg-active: rgba(185, 28, 28, 0.11);

  /* Champagne Gold Borders */
  --border-subtle: rgba(161, 118, 35, 0.22);
  --border-default: rgba(161, 118, 35, 0.36);
  --border-strong: rgba(161, 118, 35, 0.56);

  /* Deep Midnight Ink Text */
  --text-primary: #12202b;
  --text-secondary: #374a57;
  --text-muted: #586c78;
  --text-inverse: #ffffff;

  /* Luxury Christmas Brand Palette */
  --accent: #b91c1c;
  --accent-hover: #991b1b;
  --accent-soft: rgba(185, 28, 28, 0.12);
  --accent-text: #991b1b;

  --xmas-gold: #c98a1c;
  --xmas-gold-strong: #9a6509;
  --xmas-gold-soft: rgba(217, 155, 39, 0.16);
  --xmas-gold-text: #7c4d03;
  --gold-gradient: linear-gradient(135deg, #f5c65c 0%, #d49b27 55%, #a16f0c 100%);
  --xmas-pine: #15803d;
  --xmas-pine-soft: rgba(21, 128, 61, 0.14);

  /* Semantic Finance Palette */
  --color-income: #10b981;
  --income-soft: rgba(16, 185, 129, 0.14);
  --income-text: #047857;

  --color-expense: #e11d48;
  --expense-soft: rgba(225, 29, 72, 0.12);
  --expense-text: #be123c;

  --color-savings: #4f46e5;
  --savings-soft: rgba(79, 70, 229, 0.12);
  --savings-text: #4338ca;

  --color-transfer: #c98a1c;
  --transfer-soft: rgba(217, 155, 39, 0.16);
  --transfer-text: #92400e;

  /* Status Aliases */
  --color-info: #c98a1c;
  --info-soft: rgba(217, 155, 39, 0.14);
  --info-text: #7c4d03;

  --color-success: #10b981;
  --success-soft: rgba(16, 185, 129, 0.14);
  --success-text: #047857;

  --color-warning: #d97706;
  --warning-soft: rgba(217, 119, 6, 0.15);
  --warning-text: #92400e;

  --color-danger: #e11d48;
  --danger-soft: rgba(225, 29, 72, 0.12);
  --danger-text: #be123c;

  /* Shadows */
  --shadow-xs: 0 2px 6px rgba(20, 32, 43, 0.08);
  --shadow-sm: 0 6px 18px rgba(20, 32, 43, 0.10), 0 1px 3px rgba(161, 118, 35, 0.10);
  --shadow-md: 0 14px 32px rgba(20, 32, 43, 0.14), 0 0 20px rgba(217, 155, 39, 0.10);
  --shadow-lg: 0 24px 52px rgba(20, 32, 43, 0.22);
}

/* Base Reset */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  overflow-x: clip;
}

body {
  margin: 0;
  min-height: 100dvh;
  background-color: var(--bg-canvas);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 0.9375rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
  transition: background-color var(--transition-base), color var(--transition-base);
}

body.modal-open {
  overflow: hidden;
}

[hidden] {
  display: none !important;
}

img,
svg {
  display: block;
  max-width: 100%;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

h1, h2, h3, h4, p {
  margin: 0;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Utilities */
.tabular-nums,
.num,
.amount {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.text-muted {
  color: var(--text-muted);
}

.text-secondary {
  color: var(--text-secondary);
}

.text-income {
  color: var(--income-text);
}

.text-expense {
  color: var(--expense-text);
}

.text-savings {
  color: var(--savings-text);
}

.text-transfer {
  color: var(--transfer-text);
}

.text-accent {
  color: var(--accent-text);
}

.truncate {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Subtle Scrollbars */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--border-default);
  border-radius: var(--radius-pill);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--border-strong);
}

     - Tablet:  768px - 1023px (Slide-over drawer + 2-col grids)
     - Mobile:  < 768px (Compact topbar + fixed bottom nav + stacked cards)
   ========================================================================== */

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(800px 420px at 85% 12%, rgba(245, 198, 92, 0.14), transparent 60%),
    linear-gradient(180deg, rgba(6, 15, 24, 0.56) 0%, rgba(7, 17, 26, 0.68) 100%);
}

[data-theme="light"] body::after {
  background:
    radial-gradient(800px 420px at 85% 12%, rgba(245, 198, 92, 0.16), transparent 60%),
    linear-gradient(180deg, rgba(250, 245, 235, 0.62) 0%, rgba(247, 240, 226, 0.72) 100%);
}

.app-shell {
  position: relative;
  display: flex;
  min-height: 100dvh;
  width: 100%;
  background: transparent;
}

/* Lightweight Pure-CSS Golden Starlight & Snowfall Dust */
.app-shell::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.42;
  background-image:
    radial-gradient(2px 2px at 12% 18%, rgba(255, 255, 255, 0.85), transparent),
    radial-gradient(2.5px 2.5px at 28% 42%, rgba(253, 230, 138, 0.9), transparent),
    radial-gradient(1.5px 1.5px at 44% 12%, rgba(255, 255, 255, 0.8), transparent),
    radial-gradient(2px 2px at 66% 28%, rgba(253, 230, 138, 0.85), transparent),
    radial-gradient(2px 2px at 82% 52%, rgba(255, 255, 255, 0.75), transparent),
    radial-gradient(1.8px 1.8px at 18% 76%, rgba(253, 230, 138, 0.75), transparent),
    radial-gradient(2px 2px at 54% 82%, rgba(255, 255, 255, 0.7), transparent),
    radial-gradient(2.2px 2.2px at 90% 18%, rgba(253, 230, 138, 0.9), transparent);
  background-size: 380px 380px;
  animation: xmasSnowDrift 26s linear infinite;
}

@keyframes xmasSnowDrift {
  from {
    background-position: 0 0;
  }
  to {
    background-position: 40px 380px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .app-shell::before {
    animation: none;
  }
}

/* --------------------------------------------------------------------------
   Sidebar Navigation
   -------------------------------------------------------------------------- */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-w);
  height: 100dvh;
  z-index: var(--z-sidebar);
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 20px 14px 16px;
  background-color: var(--bg-glass);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-right: 1px solid var(--border-default);
  box-shadow: inset -1px 0 0 rgba(253, 230, 138, 0.08);
  overflow-y: auto;
  transition: transform var(--transition-base), background-color var(--transition-base);
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 4px 8px 8px;
}

.brand-mark {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  border-radius: var(--radius-md);
  display: grid;
  place-items: center;
  background: var(--gold-gradient);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: #1f1403;
  box-shadow: 0 4px 18px rgba(245, 198, 92, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

.brand-text {
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 0.9375rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text-primary);
  line-height: 1.2;
}

.brand-sub {
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.01em;
}

.sidebar-cta {
  padding: 0 2px;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.sidebar-section-label {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  padding: 6px 10px 4px;
}

.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 500;
  text-align: left;
  transition: background-color var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
}

.nav-item svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  opacity: 0.85;
}

.nav-item:hover {
  background-color: var(--bg-hover);
  color: var(--text-primary);
}

.nav-item.active {
  background: linear-gradient(90deg, rgba(245, 198, 92, 0.22) 0%, rgba(200, 30, 58, 0.16) 100%);
  border-color: rgba(245, 198, 92, 0.48);
  color: #fef3c7;
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(245, 198, 92, 0.14);
}

.nav-item.active svg {
  opacity: 1;
  color: var(--xmas-gold);
}

[data-theme="light"] .nav-item.active {
  background: linear-gradient(90deg, rgba(245, 198, 92, 0.24) 0%, rgba(185, 28, 28, 0.10) 100%);
  border-color: rgba(180, 120, 20, 0.42);
  color: #7c4d03;
}

[data-theme="light"] .nav-item.active svg {
  color: var(--xmas-gold-strong);
}

.sidebar-footer {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--border-subtle);
}

.sidebar-util-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface-2);
  color: var(--text-secondary);
  font-size: 0.825rem;
  font-weight: 500;
  transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
}

.sidebar-util-btn:hover {
  background-color: var(--bg-hover);
  border-color: var(--border-default);
  color: var(--text-primary);
}

.sidebar-util-left {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.sidebar-util-left svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: var(--z-backdrop);
  background: rgba(2, 6, 23, 0.56);
  backdrop-filter: blur(2px);
}

.sidebar-backdrop.open {
  display: block;
}

/* --------------------------------------------------------------------------
   Main Wrapper & Topbar
   -------------------------------------------------------------------------- */
.main-wrapper {
  position: relative;
  z-index: 2;
  flex: 1;
  min-width: 0;
  margin-left: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: var(--z-topbar);
  height: var(--topbar-h);
  width: 100%;
  background-color: var(--bg-glass);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid var(--border-default);
}

.topbar::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 3px;
  background: linear-gradient(90deg, #b91c1c 0%, #fde68a 28%, #f5c65c 50%, #fde68a 72%, #15803d 100%);
  opacity: 0.95;
}

.topbar-inner {
  height: 100%;
  max-width: var(--content-max-w);
  margin: 0 auto;
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}

.mobile-menu-btn {
  display: none;
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  color: var(--text-primary);
}

.mobile-menu-btn:hover {
  background-color: var(--bg-hover);
  border-color: var(--border-default);
}

.topbar-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}

.view-title {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--text-primary);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cycle-range-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background-color: var(--bg-surface-2);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 0.78rem;
  font-weight: 500;
  white-space: nowrap;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* --------------------------------------------------------------------------
   Main Content & Rollover Banner
   -------------------------------------------------------------------------- */
.main-content {
  width: 100%;
  max-width: var(--content-max-w);
  margin: 0 auto;
  padding: 24px 28px 44px;
  flex: 1;
  min-width: 0;
}

.rollover-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  padding: 12px 16px;
  margin-bottom: 20px;
  border-radius: var(--radius-md);
  background-color: var(--info-soft);
  border: 1px solid rgba(56, 189, 248, 0.28);
  color: var(--text-primary);
}

.rollover-banner-content {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1 1 260px;
  font-size: 0.875rem;
}

.rollover-banner-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background-color: var(--accent-soft);
  color: var(--accent);
}

.rollover-banner-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.view-panel {
  display: none;
  min-width: 0;
}

.view-panel.active {
  display: block;
  animation: viewFadeIn 180ms ease-out;
}

@keyframes viewFadeIn {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* --------------------------------------------------------------------------
   Responsive Grid & Stack Primitives (Used by Wave 2 Views)
   -------------------------------------------------------------------------- */
.stack-xs {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.stack-sm {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.stack-md {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}

.stack-lg {
  display: flex;
  flex-direction: column;
  gap: 24px;
  min-width: 0;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}

.grid-dashboard {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}

.grid-split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}

.grid-charts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}

.grid-2 > *,
.grid-3 > *,
.grid-4 > *,
.grid-dashboard > *,
.grid-split > *,
.grid-charts > * {
  min-width: 0;
}

.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}

.row-wrap {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  min-width: 0;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.section-title {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.section-subtitle {
  font-size: 0.8125rem;
  color: var(--text-secondary);
}

/* --------------------------------------------------------------------------
   Mobile Bottom Navigation (< 768px)
   -------------------------------------------------------------------------- */
.mobile-bottom-nav {
  display: none;
}

/* --------------------------------------------------------------------------
   Tablet Breakpoint (<= 1023px)
   -------------------------------------------------------------------------- */
@media (max-width: 1023px) {
  .sidebar {
    transform: translateX(-100%);
    box-shadow: var(--shadow-lg);
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .main-wrapper {
    margin-left: 0;
  }

  .mobile-menu-btn {
    display: inline-flex;
  }

  .topbar-inner {
    padding: 0 20px;
  }

  .main-content {
    padding: 20px 20px 36px;
  }

  .grid-4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .grid-3 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .grid-dashboard,
  .grid-split,
  .grid-charts {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* --------------------------------------------------------------------------
   Mobile Breakpoint (< 768px)
   -------------------------------------------------------------------------- */
@media (max-width: 767px) {
  .topbar {
    height: 56px;
  }

  .topbar-inner {
    padding: 0 12px;
    gap: 8px;
  }

  .topbar-left {
    gap: 8px;
  }

  .topbar-heading {
    gap: 6px;
  }

  .view-title {
    font-size: 0.98rem;
  }

  .cycle-range-pill {
    font-size: 0.7rem;
    padding: 2px 7px;
  }

  .topbar-actions {
    gap: 6px;
  }

  #topbarSyncText {
    display: none;
  }

  .main-content {
    padding: 16px 14px calc(var(--bottom-nav-h) + 24px + env(safe-area-inset-bottom, 0px));
  }

  .grid-2,
  .grid-3,
  .grid-4 {
    grid-template-columns: minmax(0, 1fr);
    gap: 12px;
  }

  .grid-dashboard,
  .grid-split,
  .grid-charts {
    gap: 14px;
  }

  .mobile-bottom-nav {
    position: fixed;
    inset: auto 0 0 0;
    z-index: var(--z-bottom-nav);
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    align-items: stretch;
    height: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px));
    padding: 4px 4px env(safe-area-inset-bottom, 0px);
    background-color: var(--bg-glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-subtle);
  }

  .mobile-nav-btn {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 4px 2px;
    border: none;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-muted);
    font-size: 0.65rem;
    font-weight: 500;
    line-height: 1.1;
    transition: color var(--transition-fast), background-color var(--transition-fast);
  }

  .mobile-nav-btn svg {
    width: 19px;
    height: 19px;
    flex-shrink: 0;
  }

  .mobile-nav-btn span {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mobile-nav-btn.active {
    color: var(--accent-text);
    background-color: var(--accent-soft);
    font-weight: 600;
  }
}

@media (max-width: 419px) {
  .cycle-range-pill {
    display: none;
  }
}


/* ==========================================================================
   MONEY-TRACK UI Component Primitives
   ========================================================================== */

/* --------------------------------------------------------------------------
   Buttons
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 38px;
  padding: 0 14px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 0.875rem;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  text-decoration: none;
  transition:
    background-color var(--transition-fast),
    border-color var(--transition-fast),
    color var(--transition-fast),
    transform var(--transition-fast),
    box-shadow var(--transition-fast);
}

.btn svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.btn:active:not(:disabled) {
  transform: translateY(1px);
}

.btn:disabled {
  opacity: 0.48;
  cursor: not-allowed;
}

.btn-primary {
  background: linear-gradient(135deg, #c81e3a 0%, #9f1239 100%);
  border-color: rgba(245, 198, 92, 0.45);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(200, 30, 58, 0.30), inset 0 1px 0 rgba(253, 230, 138, 0.32);
}

.btn-primary:hover:not(:disabled) {
  background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
  border-color: rgba(253, 230, 138, 0.72);
}

.btn-secondary {
  background-color: var(--bg-surface-2);
  border-color: var(--border-default);
  color: var(--text-primary);
}

.btn-secondary:hover:not(:disabled) {
  background-color: var(--bg-surface-3);
  border-color: var(--border-strong);
}

.btn-ghost {
  background-color: transparent;
  color: var(--text-secondary);
}

.btn-ghost:hover:not(:disabled) {
  background-color: var(--bg-hover);
  color: var(--text-primary);
}

.btn-danger {
  background-color: var(--color-danger);
  color: #ffffff;
}

.btn-danger:hover:not(:disabled) {
  filter: brightness(1.08);
}

.btn-danger-soft {
  background-color: var(--danger-soft);
  border-color: rgba(244, 63, 94, 0.25);
  color: var(--danger-text);
}

.btn-danger-soft:hover:not(:disabled) {
  background-color: rgba(244, 63, 94, 0.22);
}

.btn-success {
  background-color: var(--color-income);
  color: #ffffff;
}

.btn-success:hover:not(:disabled) {
  filter: brightness(1.06);
}

.btn-sm {
  height: 32px;
  padding: 0 10px;
  font-size: 0.8rem;
  border-radius: var(--radius-xs);
}

.btn-lg {
  height: 44px;
  padding: 0 18px;
  font-size: 0.9375rem;
  border-radius: var(--radius-md);
}

.btn-block {
  width: 100%;
}

.btn-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  color: var(--text-secondary);
}

.btn-icon:hover:not(:disabled) {
  background-color: var(--bg-hover);
  border-color: var(--border-default);
  color: var(--text-primary);
}

.btn-icon.btn-sm {
  width: 30px;
  height: 30px;
}

/* --------------------------------------------------------------------------
   Sync Status Pill
   -------------------------------------------------------------------------- */
.sync-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 11px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-weight: 500;
  white-space: nowrap;
  transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
}

.sync-pill:hover {
  background-color: var(--bg-hover);
  border-color: var(--border-default);
  color: var(--text-primary);
}

.sync-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  background-color: var(--text-muted);
}

.sync-dot.online,
.sync-dot.synced,
.sync-dot.ok {
  background-color: var(--color-income);
  box-shadow: 0 0 0 3px var(--income-soft);
}

.sync-dot.syncing,
.sync-dot.pending {
  background-color: var(--color-transfer);
  box-shadow: 0 0 0 3px var(--transfer-soft);
  animation: pulseDot 1.2s ease-in-out infinite;
}

.sync-dot.error,
.sync-dot.offline {
  background-color: var(--color-expense);
  box-shadow: 0 0 0 3px var(--expense-soft);
}

@keyframes pulseDot {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.5;
    transform: scale(0.82);
  }
}

/* --------------------------------------------------------------------------
   Cards
   -------------------------------------------------------------------------- */
.card {
  background-color: var(--bg-surface);
  backdrop-filter: blur(16px) saturate(135%);
  -webkit-backdrop-filter: blur(16px) saturate(135%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(253, 230, 138, 0.10);
  min-width: 0;
}

.card-elevated {
  background-color: var(--bg-elevated);
  border-color: var(--border-default);
  box-shadow: var(--shadow-sm);
}

.card-interactive {
  transition: border-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
}

.card-interactive:hover {
  border-color: var(--border-default);
  box-shadow: var(--shadow-sm);
}

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.card-title {
  font-family: var(--font-display);
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.card-subtitle {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

.card-body {
  min-width: 0;
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border-subtle);
}

/* --------------------------------------------------------------------------
   Hero Balance Card (Luxury Christmas Gold Glass Edition)
   -------------------------------------------------------------------------- */
.hero-balance-card {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 24px 26px;
  border-radius: var(--radius-xl);
  border: 1px solid rgba(245, 198, 92, 0.45);
  background:
    radial-gradient(500px 240px at 92% 4%, rgba(245, 198, 92, 0.22), transparent 68%),
    radial-gradient(400px 240px at 6% 96%, rgba(200, 30, 58, 0.20), transparent 70%),
    linear-gradient(135deg, rgba(12, 26, 39, 0.84) 0%, rgba(11, 24, 22, 0.86) 55%, rgba(24, 15, 22, 0.86) 100%);
  backdrop-filter: blur(18px) saturate(145%);
  -webkit-backdrop-filter: blur(18px) saturate(145%);
  box-shadow:
    0 18px 42px rgba(2, 6, 14, 0.56),
    0 0 32px rgba(245, 198, 92, 0.14),
    inset 0 1px 0 rgba(253, 230, 138, 0.34);
}

.hero-balance-card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 3px;
  background: linear-gradient(90deg, #c81e3a 0%, #fde68a 35%, #f5c65c 55%, #fde68a 75%, #15803d 100%);
}

[data-theme="light"] .hero-balance-card {
  border-color: rgba(180, 120, 20, 0.44);
  background:
    radial-gradient(500px 240px at 92% 4%, rgba(245, 198, 92, 0.24), transparent 68%),
    radial-gradient(400px 240px at 6% 96%, rgba(185, 28, 28, 0.10), transparent 70%),
    linear-gradient(135deg, rgba(255, 253, 248, 0.90) 0%, rgba(252, 246, 231, 0.92) 100%);
  box-shadow:
    0 16px 36px rgba(20, 32, 43, 0.16),
    0 0 24px rgba(217, 155, 39, 0.14),
    inset 0 1px 0 rgba(255, 255, 255, 0.85);
}

.hero-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--xmas-gold-text);
  letter-spacing: 0.01em;
  margin-bottom: 6px;
}

.hero-balance-amount {
  font-family: var(--font-display);
  font-size: clamp(2.15rem, 4.1vw, 3rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.08;
  color: var(--text-primary);
  text-shadow: 0 2px 16px rgba(245, 198, 92, 0.18);
  font-variant-numeric: tabular-nums;
}

[data-theme="light"] .hero-balance-amount {
  text-shadow: none;
}

.hero-summary-line {
  margin-top: 6px;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.hero-meta-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.hero-stat-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-radius: var(--radius-md);
  background-color: rgba(7, 17, 26, 0.55);
  border: 1px solid rgba(245, 198, 92, 0.24);
  font-size: 0.82rem;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}

[data-theme="light"] .hero-stat-chip {
  background-color: var(--bg-surface-2);
  border-color: rgba(161, 118, 35, 0.26);
}

.hero-stat-chip strong {
  color: var(--text-primary);
  font-weight: 700;
}

.hero-actions-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding-top: 14px;
  border-top: 1px solid var(--border-subtle);
}

.btn-gold {
  background: var(--gold-gradient);
  border-color: rgba(255, 255, 255, 0.35);
  color: #1f1403;
  font-weight: 700;
  box-shadow: 0 4px 16px rgba(245, 198, 92, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.52);
}

.btn-gold:hover:not(:disabled) {
  filter: brightness(1.06);
  box-shadow: 0 6px 20px rgba(245, 198, 92, 0.42);
}

.btn-pine {
  background-color: var(--xmas-pine-soft);
  border-color: rgba(21, 128, 61, 0.38);
  color: var(--income-text);
}

.btn-pine:hover:not(:disabled) {
  background-color: rgba(21, 128, 61, 0.30);
}

.badge-gold {
  background-color: var(--xmas-gold-soft);
  color: var(--xmas-gold-text);
  border: 1px solid rgba(229, 184, 75, 0.28);
}

@media (max-width: 639px) {
  .hero-balance-card {
    padding: 18px 16px;
    gap: 14px;
  }

  .hero-actions-bar .btn {
    flex: 1 1 calc(50% - 6px);
  }
}

/* --------------------------------------------------------------------------
   KPI Cards
   -------------------------------------------------------------------------- */
.kpi-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px 18px;
  background-color: var(--bg-surface);
  backdrop-filter: blur(16px) saturate(135%);
  -webkit-backdrop-filter: blur(16px) saturate(135%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(253, 230, 138, 0.12);
  min-width: 0;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.kpi-card:hover {
  border-color: var(--border-default);
}

.kpi-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.kpi-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.kpi-icon {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background-color: var(--bg-surface-2);
  color: var(--text-secondary);
}

.kpi-icon svg {
  width: 17px;
  height: 17px;
}

.kpi-icon.income {
  background-color: var(--income-soft);
  color: var(--income-text);
}

.kpi-icon.expense {
  background-color: var(--expense-soft);
  color: var(--expense-text);
}

.kpi-icon.savings {
  background-color: var(--savings-soft);
  color: var(--savings-text);
}

.kpi-icon.transfer {
  background-color: var(--transfer-soft);
  color: var(--transfer-text);
}

.kpi-icon.accent {
  background-color: var(--accent-soft);
  color: var(--accent-text);
}

.kpi-value {
  font-family: var(--font-display);
  font-size: clamp(1.32rem, 2.2vw, 1.65rem);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.15;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  word-break: break-word;
}

.kpi-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 0.78rem;
  color: var(--text-muted);
}

.kpi-delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.76rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
}

.kpi-delta.up {
  background-color: var(--income-soft);
  color: var(--income-text);
}

.kpi-delta.down {
  background-color: var(--expense-soft);
  color: var(--expense-text);
}

.kpi-delta.neutral {
  background-color: var(--bg-surface-2);
  color: var(--text-secondary);
}

/* --------------------------------------------------------------------------
   Account / Channel Cards
   -------------------------------------------------------------------------- */
.account-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px 18px;
  background-color: var(--bg-surface);
  backdrop-filter: blur(16px) saturate(135%);
  -webkit-backdrop-filter: blur(16px) saturate(135%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(253, 230, 138, 0.12);
  min-width: 0;
}

.account-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.account-title {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-weight: 600;
  font-size: 0.92rem;
  color: var(--text-primary);
}

.account-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background-color: var(--accent);
}

.account-balance {
  font-family: var(--font-display);
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}

.account-breakdown {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border-subtle);
  font-size: 0.78rem;
}

.account-stat {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  color: var(--text-secondary);
}

.account-stat strong {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--text-primary);
}

/* --------------------------------------------------------------------------
   Progress Bars
   -------------------------------------------------------------------------- */
.progress-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
  font-size: 0.82rem;
}

.progress-track {
  width: 100%;
  height: 8px;
  border-radius: var(--radius-pill);
  background-color: var(--bg-surface-3);
  overflow: hidden;
}

.progress-track.progress-sm {
  height: 6px;
}

.progress-track.progress-lg {
  height: 11px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: var(--radius-pill);
  background-color: var(--accent);
  transition: width 320ms cubic-bezier(0.2, 0, 0, 1), background-color var(--transition-fast);
}

.progress-fill.ok {
  background-color: var(--color-income);
}

.progress-fill.warn {
  background-color: var(--color-transfer);
}

.progress-fill.over {
  background-color: var(--color-expense);
}

.progress-fill.savings {
  background-color: var(--color-savings);
}

/* --------------------------------------------------------------------------
   Badges & Pills
   -------------------------------------------------------------------------- */
.badge,
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  font-size: 0.74rem;
  font-weight: 600;
  line-height: 1.3;
  white-space: nowrap;
}

.badge-neutral {
  background-color: var(--bg-surface-2);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
}

.badge-accent {
  background-color: var(--accent-soft);
  color: var(--accent-text);
}

.badge-income,
.badge-ok {
  background-color: var(--income-soft);
  color: var(--income-text);
}

.badge-expense,
.badge-over {
  background-color: var(--expense-soft);
  color: var(--expense-text);
}

.badge-savings {
  background-color: var(--savings-soft);
  color: var(--savings-text);
}

.badge-transfer,
.badge-warn {
  background-color: var(--transfer-soft);
  color: var(--transfer-text);
}

/* --------------------------------------------------------------------------
   Segmented Toggles & Quick Chips
   -------------------------------------------------------------------------- */
.segmented {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px;
  border-radius: var(--radius-md);
  background-color: var(--bg-surface-2);
  border: 1px solid var(--border-subtle);
  max-width: 100%;
  overflow-x: auto;
}

.seg-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 12px;
  border: 1px solid transparent;
  border-radius: calc(var(--radius-md) - 3px);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.82rem;
  font-weight: 600;
  white-space: nowrap;
  transition: background-color var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.seg-btn:hover {
  color: var(--text-primary);
}

.seg-btn.active {
  background: linear-gradient(135deg, rgba(200, 30, 58, 0.30) 0%, rgba(245, 198, 92, 0.24) 100%);
  border-color: rgba(245, 198, 92, 0.58);
  color: #fef3c7;
  box-shadow: 0 2px 10px rgba(245, 198, 92, 0.18);
}

[data-theme="light"] .seg-btn.active {
  background: linear-gradient(135deg, rgba(185, 28, 28, 0.14) 0%, rgba(245, 198, 92, 0.28) 100%);
  border-color: rgba(180, 120, 20, 0.52);
  color: #7c4d03;
}

.chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-default);
  background-color: var(--bg-surface-2);
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-weight: 500;
  transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
}

.chip:hover {
  border-color: var(--border-strong);
  color: var(--text-primary);
}

.chip.active {
  background-color: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
}

/* --------------------------------------------------------------------------
   Filter Bar & Search
   -------------------------------------------------------------------------- */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  background-color: var(--bg-surface);
  backdrop-filter: blur(16px) saturate(135%);
  -webkit-backdrop-filter: blur(16px) saturate(135%);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xs);
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  flex: 1 1 auto;
  min-width: 0;
}

.search-input-wrap {
  position: relative;
  flex: 1 1 220px;
  min-width: 0;
}

.search-input-wrap svg {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--text-muted);
  pointer-events: none;
}

.search-input-wrap .input {
  padding-left: 34px;
}

/* --------------------------------------------------------------------------
   Transactions List & Data Table
   -------------------------------------------------------------------------- */
.tx-list {
  display: flex;
  flex-direction: column;
}

.tx-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid var(--border-subtle);
  transition: background-color var(--transition-fast);
}

.tx-row:last-child {
  border-bottom: none;
}

.tx-row:hover {
  background-color: var(--bg-hover);
  border-radius: var(--radius-sm);
}

.tx-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1;
}

.tx-icon {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-md);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background-color: var(--bg-surface-2);
  color: var(--text-secondary);
}

.tx-icon svg {
  width: 17px;
  height: 17px;
}

.tx-icon.income {
  background-color: var(--income-soft);
  color: var(--income-text);
}

.tx-icon.expense {
  background-color: var(--expense-soft);
  color: var(--expense-text);
}

.tx-icon.savings {
  background-color: var(--savings-soft);
  color: var(--savings-text);
}

.tx-icon.transfer {
  background-color: var(--transfer-soft);
  color: var(--transfer-text);
}

.tx-main {
  min-width: 0;
  flex: 1;
}

.tx-title {
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tx-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
  font-size: 0.775rem;
  color: var(--text-muted);
}

.tx-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.tx-amount {
  font-family: var(--font-display);
  font-size: 0.95rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  text-align: right;
}

.tx-amount.income {
  color: var(--income-text);
}

.tx-amount.expense {
  color: var(--expense-text);
}

.tx-amount.savings {
  color: var(--savings-text);
}

.tx-amount.transfer {
  color: var(--transfer-text);
}

.tx-actions {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  background-color: var(--bg-surface);
  backdrop-filter: blur(16px) saturate(135%);
  -webkit-backdrop-filter: blur(16px) saturate(135%);
  box-shadow: var(--shadow-xs);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.86rem;
}

.data-table th {
  text-align: left;
  padding: 11px 14px;
  font-size: 0.74rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  background-color: var(--bg-surface-2);
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
}

.data-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-primary);
  vertical-align: middle;
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table tbody tr:hover {
  background-color: var(--bg-hover);
}

.data-table .col-num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* --------------------------------------------------------------------------
   Forms & Inputs
   -------------------------------------------------------------------------- */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.form-grid .full {
  grid-column: 1 / -1;
}

.form-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  flex-wrap: wrap;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.field-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.field-hint {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.field-error {
  font-size: 0.75rem;
  color: var(--expense-text);
  font-weight: 500;
}

.input,
.select,
.textarea {
  width: 100%;
  min-width: 0;
  height: 40px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-default);
  background-color: var(--bg-surface-2);
  color: var(--text-primary);
  font-size: 0.9rem;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background-color var(--transition-fast);
}

.textarea {
  height: auto;
  min-height: 82px;
  padding: 10px 12px;
  resize: vertical;
}

.input::placeholder,
.textarea::placeholder {
  color: var(--text-muted);
}

.input:focus,
.select:focus,
.textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  background-color: var(--bg-surface);
}

.input-sm,
.select-sm {
  height: 34px;
  padding: 0 10px;
  font-size: 0.825rem;
}

.input-group {
  display: flex;
  align-items: stretch;
  width: 100%;
}

.input-prefix,
.input-suffix {
  display: inline-flex;
  align-items: center;
  padding: 0 11px;
  background-color: var(--bg-surface-3);
  border: 1px solid var(--border-default);
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-weight: 600;
  white-space: nowrap;
}

.input-prefix {
  border-right: none;
  border-radius: var(--radius-sm) 0 0 var(--radius-sm);
}

.input-suffix {
  border-left: none;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.input-group .input {
  flex: 1;
}

.input-group .input-prefix + .input {
  border-top-left-radius: 0;
  border-bottom-left-radius: 0;
}

.checkbox-row {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.875rem;
  color: var(--text-primary);
  cursor: pointer;
}

.checkbox-row input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}

/* Switch toggle */
.switch {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 40px;
  height: 22px;
  flex-shrink: 0;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
  position: absolute;
}

.switch-track {
  position: relative;
  width: 40px;
  height: 22px;
  border-radius: var(--radius-pill);
  background-color: var(--bg-surface-3);
  border: 1px solid var(--border-default);
  transition: background-color var(--transition-fast);
  cursor: pointer;
}

.switch-track::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background-color: #ffffff;
  transition: transform var(--transition-fast);
  box-shadow: var(--shadow-xs);
}

.switch input:checked + .switch-track {
  background-color: var(--color-income);
  border-color: var(--color-income);
}

.switch input:checked + .switch-track::after {
  transform: translateX(18px);
}

@media (max-width: 639px) {
  .form-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* --------------------------------------------------------------------------
   Charts, Legends & Floating Tooltip
   -------------------------------------------------------------------------- */
.chart-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.chart-wrap {
  position: relative;
  width: 100%;
  min-width: 0;
  overflow: hidden;
}

.chart-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  font-size: 0.78rem;
  color: var(--text-secondary);
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

.chart-tooltip {
  position: fixed;
  z-index: var(--z-tooltip);
  pointer-events: none;
  max-width: 260px;
  padding: 8px 11px;
  border-radius: var(--radius-sm);
  background-color: var(--bg-elevated);
  border: 1px solid var(--border-default);
  box-shadow: var(--shadow-md);
  color: var(--text-primary);
  font-size: 0.78rem;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  white-space: pre-line;
  opacity: 0;
  transition: opacity 100ms ease-out;
}

.chart-tooltip.visible {
  opacity: 1;
}

.chart-tooltip strong {
  display: block;
  font-weight: 700;
  margin-bottom: 2px;
}

/* --------------------------------------------------------------------------
   Insight Cards, Goals, Recurring & Settings
   -------------------------------------------------------------------------- */
.insight-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.insight-item {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background-color: var(--bg-surface-2);
  border: 1px solid var(--border-subtle);
  font-size: 0.85rem;
}

.insight-item.ok {
  border-color: rgba(16, 185, 129, 0.25);
  background-color: var(--income-soft);
}

.insight-item.warn {
  border-color: rgba(245, 158, 11, 0.28);
  background-color: var(--transfer-soft);
}

.insight-item.over {
  border-color: rgba(244, 63, 94, 0.28);
  background-color: var(--expense-soft);
}

.insight-item.info {
  border-color: rgba(56, 189, 248, 0.25);
  background-color: var(--info-soft);
}

.goal-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.goal-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.goal-stats {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  font-variant-numeric: tabular-nums;
}

.recurring-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background-color: var(--bg-surface-2);
  border: 1px solid var(--border-subtle);
}

.settings-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  padding: 12px 0;
  border-bottom: 1px solid var(--border-subtle);
}

.settings-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.settings-info {
  min-width: 0;
  flex: 1 1 220px;
}

.settings-label {
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--text-primary);
}

.settings-desc {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-top: 2px;
}

.category-pill-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.category-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: var(--radius-pill);
  background-color: var(--bg-surface-2);
  border: 1px solid var(--border-default);
  font-size: 0.8rem;
  color: var(--text-primary);
}

.category-pill button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: var(--text-muted);
}

.category-pill button:hover {
  background-color: var(--expense-soft);
  color: var(--expense-text);
}

/* --------------------------------------------------------------------------
   Empty States
   -------------------------------------------------------------------------- */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 8px;
  padding: 36px 20px;
  border-radius: var(--radius-lg);
  border: 1px dashed var(--border-default);
  background-color: var(--bg-surface);
  color: var(--text-secondary);
}

.empty-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  display: grid;
  place-items: center;
  background-color: var(--bg-surface-2);
  color: var(--text-muted);
  margin-bottom: 4px;
}

.empty-title {
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--text-primary);
}

.empty-desc {
  font-size: 0.825rem;
  color: var(--text-secondary);
  max-width: 340px;
}

/* --------------------------------------------------------------------------
   Modals
   -------------------------------------------------------------------------- */
#modalRoot {
  position: relative;
  z-index: var(--z-modal);
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background-color: rgba(2, 6, 23, 0.66);
  backdrop-filter: blur(4px);
  overflow-y: auto;
}

.modal-backdrop.open {
  display: flex;
  animation: modalFadeIn 150ms ease-out;
}

.modal-dialog {
  width: 100%;
  max-height: calc(100dvh - 32px);
  display: flex;
  flex-direction: column;
  background-color: var(--bg-elevated);
  backdrop-filter: blur(20px) saturate(145%);
  -webkit-backdrop-filter: blur(20px) saturate(145%);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(253, 230, 138, 0.22);
  overflow: hidden;
  animation: modalSlideUp 170ms cubic-bezier(0.2, 0, 0, 1);
}

.modal-sm {
  max-width: 420px;
}

.modal-md {
  max-width: 560px;
}

.modal-lg {
  max-width: 760px;
}

.modal-xl {
  max-width: 960px;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-subtle);
}

.modal-title {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
}

.modal-close {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-secondary);
}

.modal-close:hover {
  background-color: var(--bg-hover);
  color: var(--text-primary);
}

.modal-body {
  padding: 18px 20px;
  overflow-y: auto;
}

.modal-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  flex-wrap: wrap;
  padding: 14px 20px;
  border-top: 1px solid var(--border-subtle);
  background-color: var(--bg-surface-2);
}

@keyframes modalFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modalSlideUp {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* --------------------------------------------------------------------------
   Toast Notifications
   -------------------------------------------------------------------------- */
.toast-container {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: var(--z-toast);
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: min(380px, calc(100vw - 28px));
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  background-color: var(--bg-elevated);
  border: 1px solid var(--border-default);
  box-shadow: var(--shadow-md);
  color: var(--text-primary);
  font-size: 0.85rem;
  line-height: 1.4;
  animation: toastIn 190ms cubic-bezier(0.2, 0, 0, 1);
}

.toast.toast-leaving {
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 150ms ease, transform 150ms ease;
}

.toast-icon {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  margin-top: 1px;
}

.toast-info {
  border-left: 3px solid var(--color-info);
}
.toast-info .toast-icon {
  color: var(--info-text);
}

.toast-success {
  border-left: 3px solid var(--color-success);
}
.toast-success .toast-icon {
  color: var(--income-text);
}

.toast-warning {
  border-left: 3px solid var(--color-warning);
}
.toast-warning .toast-icon {
  color: var(--transfer-text);
}

.toast-error {
  border-left: 3px solid var(--color-danger);
}
.toast-error .toast-icon {
  color: var(--expense-text);
}

.toast-msg {
  flex: 1;
  min-width: 0;
  word-break: break-word;
}

.toast-close {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: var(--radius-xs);
  background: transparent;
  color: var(--text-muted);
  flex-shrink: 0;
}

.toast-close:hover {
  background-color: var(--bg-hover);
  color: var(--text-primary);
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@media (max-width: 767px) {
  .toast-container {
    right: 12px;
    left: 12px;
    bottom: calc(var(--bottom-nav-h) + 12px + env(safe-area-inset-bottom, 0px));
    max-width: none;
  }

  .topbar-actions .btn-primary {
    height: 34px;
    padding: 0 10px;
    font-size: 0.8rem;
  }

  .topbar-actions .sync-pill {
    height: 34px;
    padding: 0 9px;
  }

  .topbar-actions .btn-icon {
    width: 34px;
    height: 34px;
  }
}

  "วันพฤหัสบดี",
  "วันศุกร์",
  "วันเสาร์"

  const history = Array.isArray(state?.history) ? state.history : [];
  if (history.length === 0) return null;

  return (
    history.find((h) => h && h.start === expectedPrev) ||
    history
      .filter((h) => h && ISO_RE.test(h.start) && h.start < cycleStartISO)
      .sort((a, b) => b.start.localeCompare(a.start))[0] ||
    null

/**
 * Generate factual and clearly labeled estimated insights from real transaction data.
 * Never fabricates insights when transactions are empty.

function generateSmartInsights(state, refDate = new Date()) {
  if (!state || typeof state !== "object") return [];

  const refISO = toRefISO(refDate);
  const cycleStart = ISO_RE.test(state.cycleStartISO || "")
    ? state.cycleStartISO
    : getCurrentSaturdayISO(refDate);

  const currentTxs = Array.isArray(state.transactions) ? state.transactions : [];
  const currentExpenses = currentTxs.filter(
    (t) => t && t.type === "expense" && Number(t.amount) > 0

  const allExpenses = getAllUniqueTransactions(state).filter(
    (t) => t && t.type === "expense" && Number(t.amount) > 0

  const netRemaining = Number.isFinite(Number(m.netRemaining))
    ? r2(m.netRemaining)
    : r2(

          (rollByCh.TrueMoney || 0) +
          r2(m.extraIncome ?? m.income) -
          expenseTotal -

      );

  const insights = [];

  // 1. Top expense category in current cycle (actual)
  if (currentExpenses.length > 0 && expenseTotal > 0) {
    const byCat = new Map();
    for (const tx of currentExpenses) {
      const cat = String(tx.category || "อื่นๆ").trim() || "อื่นๆ";

    const share = r2((topAmt / expenseTotal) * 100);

      id: "top_expense_category",

    const dayCounts = new Array(7).fill(0);
    for (const tx of weekdaySource.txs) {
      if (!ISO_RE.test(tx.date || "")) continue;

      dayTotals[dow] = r2(dayTotals[dow] + r2(tx.amount));

        id: "peak_spending_weekday",
        title: "วันใช้จ่ายสูงสุด",
        value: `${THAI_WEEKDAYS[bestDow]} (${formatTHB(bestAmt)})`,
        detail: `จากข้อมูลจริง ${weekdaySource.scopeLabel} (${dayCounts[bestDow]} รายการ)`,
        kind: "actual",
        badgeLabel: "ข้อมูลจริง",
        tone: "neutral"
      });
    }
  }

  // 3. Week-over-week expense comparison vs previous archived week (actual)
  const prevWeek = getPreviousArchivedWeek(state, cycleStart);
  if (prevWeek && (expenseTotal > 0 || r2(prevWeek.expense) > 0)) {
    const prevExp = r2(prevWeek.expense);
    const diff = r2(expenseTotal - prevExp);
    const prevLabel = formatShortDate(prevWeek.start);
    let valueText = `เท่าสัปดาห์ก่อน (${formatTHB(expenseTotal)})`;
    let tone = "neutral";

    if (prevExp > 0) {
      const pct = r2((diff / prevExp) * 100);
      if (diff > 0) {
        valueText = `เพิ่มขึ้น ${formatTHB(diff)} (+${pct}%)`;
        tone = pct >= 20 ? "danger" : "warning";
      } else if (diff < 0) {
        valueText = `ลดลง ${formatTHB(Math.abs(diff))} (${pct}%)`;
        tone = "positive";
      }
    } else if (diff > 0) {
      valueText = `เพิ่มขึ้น ${formatTHB(diff)}`;
      tone = "warning";
    }

    insights.push({
      id: "wow_expense_comparison",
      title: "เทียบรายจ่ายกับสัปดาห์ก่อน",
      value: valueText,
      detail: `รอบนี้ ${formatTHB(expenseTotal)} เทียบกับสัปดาห์ ${prevLabel} (${formatTHB(prevExp)})`,
      kind: "actual",
      badgeLabel: "ข้อมูลจริง",

  const diffFromStart = daysBetweenISO(cycleStart, refISO);
  const fallbackElapsed = diffFromStart < 0 ? 0 : Math.min(7, diffFromStart + 1);

    ? Number(dailyBudgetInfo.daysElapsed)
    : fallbackElapsed;
  const remainingDays = Math.max(0, 7 - daysElapsed);

  // 4. Daily average spending in current cycle (actual)
  if (daysElapsed >= 1 && expenseTotal > 0) {
    const dailyAvgActual = Number.isFinite(Number(dailyBudgetInfo?.dailyAvgActual))
      ? r2(dailyBudgetInfo.dailyAvgActual)
      : r2(expenseTotal / daysElapsed);
    const dailyTarget = Number(dailyBudgetInfo?.allow) || 0;
    let tone = "neutral";
    let budgetNote = "";

    if (dailyTarget > 0) {
      if (dailyAvgActual > dailyTarget * 1.15) {
        tone = "danger";
        budgetNote = ` (เกินเป้ารายวัน ${formatTHB(dailyTarget)})`;
      } else if (dailyAvgActual > dailyTarget) {
        tone = "warning";
        budgetNote = ` (สูงกว่าเป้ารายวัน ${formatTHB(dailyTarget)} เล็กน้อย)`;
      } else {
        tone = "positive";
        budgetNote = ` (อยู่ในเป้ารายวัน ${formatTHB(dailyTarget)})`;
      }
    }

    insights.push({
      id: "daily_average_spending",
      title: "ค่าใช้จ่ายเฉลี่ยต่อวันรอบนี้",
      value: `${formatTHB(dailyAvgActual)}/วัน`,
      detail: `คำนวณจากรายจ่ายจริง ${formatTHB(expenseTotal)} ใน ${daysElapsed} วัน${budgetNote}`,
      kind: "actual",
      badgeLabel: "ข้อมูลจริง",
      tone
    });

      kind: "estimate",
      badgeLabel: "ค่าประมาณ",
      tone: projTone
    });
  }

function ensureFilters(uiState) {
  if (!uiState || typeof uiState !== "object") {
    return { ...DEFAULT_FILTERS };
  }
  if (!uiState.txFilters || typeof uiState.txFilters !== "object") {
    uiState.txFilters = { ...DEFAULT_FILTERS };
  } else {
    uiState.txFilters = { ...DEFAULT_FILTERS, ...uiState.txFilters };
  }
  return uiState.txFilters;
}

  const set = new Set();
  const cats = state?.categories || DEFAULT_CATEGORIES;
  for (const key of ["expense", "income", "savings"]) {
    for (const c of cats[key] || []) {
      if (c) set.add(String(c));
    }
  }
  for (const tx of sourceTxs || []) {
    if (tx?.category) set.add(String(tx.category));
  }
  return [...set];
}

/** Render a budget status badge using exact Thai labels. */
function renderStatusBadge(status) {
  const info = STATUS_BADGE[status] || STATUS_BADGE.none;
  return `<span class="badge ${info.cls}">${esc(info.label)}</span>`;

/** Render a progress bar with clamped width and status color. */
function renderProgressBar(percent, status, small = false) {
  const width = status === "none" ? 0 : Math.min(100, Math.max(0, Number(percent) || 0));
  const safeStatus = STATUS_BADGE[status] ? status : "none";
  return `

function formatRemaining(limit, remaining) {
  if (!(limit > 0)) {
    return { text: "ยังไม่ตั้งงบ", cls: "text-muted" };

  if (remaining >= 0) {
    return { text: `คงเหลือ ${formatTHB(remaining)}`, cls: "text-income" };

  return { text: `เกินงบ ${formatTHB(Math.abs(remaining))}`, cls: "text-expense" };

/** Build comparison rows for all expense categories (plus any budgeted extras). */

    : [];
  for (const cat of Object.keys(state?.categoryBudgets || {})) {
    if (!expenseCats.includes(cat)) expenseCats.push(cat);
  }

  const weekMap = new Map();
  for (const tx of state?.transactions || []) {
    if (!tx || tx.type !== "expense") continue;
    const cat = String(tx.category || "อื่นๆ").trim() || "อื่นๆ";
    weekMap.set(cat, r2((weekMap.get(cat) || 0) + r2(tx.amount)));
  }

  const monthMap = new Map();
  for (const tx of getAllUniqueTransactions(state)) {
    if (!tx || tx.type !== "expense" || getMonthKey(tx.date) !== monthKey) continue;
    const cat = String(tx.category || "อื่นๆ").trim() || "อื่นๆ";
    monthMap.set(cat, r2((monthMap.get(cat) || 0) + r2(tx.amount)));
  }

  return expenseCats.map((category) => {
    const weeklySpent = r2(weekMap.get(category) || 0);
    const monthlySpent = r2(monthMap.get(category) || 0);
    const limit = r2(state?.categoryBudgets?.[category] || 0);
    const hasLimit = limit > 0;
    const variance = hasLimit ? r2(limit - monthlySpent) : null;
    const status = !hasLimit
      ? "none"
      : monthlySpent > limit
        ? "over"
        : monthlySpent / limit >= 0.8
          ? "warn"
          : "ok";
    return { category, weeklySpent, monthlySpent, limit, hasLimit, variance, status };
  });

      income,
      expense,
      savings,
      net,

    const amt = r2(tx.amount);
    if (tx.type === "income") row.income = r2(row.income + amt);
    else if (tx.type === "expense") row.expense = r2(row.expense + amt);
    else if (tx.type === "savings") row.savings = r2(row.savings + amt);
  }

  const rows = [...monthMap.values()]
    .map((row) => ({
      ...row,
      net: r2(row.income - row.expense - row.savings)
    }))
    .sort((a, b) => a.key.localeCompare(b.key));

  if (Number.isFinite(maxMonths) && maxMonths > 0) {
    return rows.slice(-maxMonths);
  }
  return rows;
}

/**
 * Aggregate category totals and percentages for expense, income, or savings.
 */
function buildCategoryBreakdown(
  state,
  { type = "expense", scope = "weekly", refDate = new Date() } = {}
) {
  const targetType = ["expense", "income", "savings"].includes(type) ? type : "expense";
  let sourceTxs = [];

  if (scope === "weekly") {
    sourceTxs = Array.isArray(state?.transactions) ? state.transactions : [];
  } else if (scope === "monthly") {
    const monthKey = getMonthKey(toRefISO(refDate));
    sourceTxs = getAllUniqueTransactions(state).filter(
      (tx) => tx && getMonthKey(tx.date) === monthKey
    );
  } else {
    sourceTxs = getAllUniqueTransactions(state);
  }

  const totalsByCat = new Map();
  let total = 0;

  for (const tx of sourceTxs) {
    if (!tx || tx.type !== targetType) continue;
    const amt = r2(tx.amount);
    if (!(amt > 0)) continue;
    const cat = String(tx.category || "อื่นๆ").trim() || "อื่นๆ";
    totalsByCat.set(cat, r2((totalsByCat.get(cat) || 0) + amt));
    total = r2(total + amt);
  }

  const entries = [...totalsByCat.entries()]
    .map(([category, amount]) => ({
      category,
      amount,
      percent: total > 0 ? r2((amount / total) * 100) : 0
    }))
    .sort((a, b) => b.amount - a.amount);

  return { total, entries };
}

/**
 * Build historical cumulative savings growth series ending at state.cumulativeSavings.
 */
function buildSavingsGrowthSeries(state, maxWeeks = 12) {
  const allWeeks = buildAllWeeklyRows(state);
  if (allWeeks.length === 0) return [];

  const endCumulative = Math.max(0, r2(state?.cumulativeSavings));
  const fullSeries = new Array(allWeeks.length);

  // Step backwards from current cumulativeSavings so prior milestones stay exact.
  let running = endCumulative;
  for (let i = allWeeks.length - 1; i >= 0; i -= 1) {
    const w = allWeeks[i];
    fullSeries[i] = {
      key: w.key,
      label: w.label,
      weeklySavings: r2(w.savings),
      cumulative: r2(running)
    };
    running = Math.max(0, r2(running - w.savings));
  }

  if (Number.isFinite(maxWeeks) && maxWeeks > 0) {
    return fullSeries.slice(-maxWeeks);
  }
  return fullSeries;
}

function calcPctChange(curr, prev) {
  if (prev > 0) return r2(((curr - prev) / prev) * 100);
  if (curr === 0 && prev === 0) return 0;
  return null;
}

/**
 * Compare current vs previous period (weekly or monthly) with deltas and % changes.
 */
function buildPeriodComparison(state, mode = "weekly", refDate = new Date()) {
  let current;
  let previous;

  if (mode === "monthly") {
    const refISO = toRefISO(refDate);
    const currMonth = getMonthKey(refISO);
    const prevMonth = getPreviousMonthKey(currMonth);
    const allTxs = getAllUniqueTransactions(state);

    const sumMonth = (ym) => {
      let income = 0;
      let expense = 0;
      let savings = 0;
      let count = 0;
      for (const tx of allTxs) {
        if (!tx || tx.type === "transfer" || getMonthKey(tx.date) !== ym) continue;
        const amt = r2(tx.amount);
        if (tx.type === "income") income = r2(income + amt);
        else if (tx.type === "expense") expense = r2(expense + amt);
        else if (tx.type === "savings") savings = r2(savings + amt);
        count += 1;
      }
      return {
        key: ym,
        label: formatMonthLabel(ym),
        income,
        expense,
        savings,
        net: r2(income - expense - savings),
        hasData: count > 0
      };
    };

    current = sumMonth(currMonth);
    previous = sumMonth(prevMonth);
  } else {
    const cycleStart = ISO_RE.test(state?.cycleStartISO || "")
      ? state.cycleStartISO
      : getCurrentSaturdayISO(refDate);
    const m = computeMetrics(state?.transactions || [], state?.rolloverByChannel || {});
    const cInc = r2(m?.extraIncome ?? m?.income);
    const cExp = r2(m?.expense);
    const cSav = r2(m?.savings);

    current = {
      key: cycleStart,
      label: formatShortDate(cycleStart),
      income: cInc,
      expense: cExp,
      savings: cSav,
      net: r2(cInc - cExp - cSav),
      hasData: (state?.transactions || []).length > 0
    };

    const expectedPrev = addDaysISO(cycleStart, -7);
    const history = Array.isArray(state?.history) ? state.history : [];
    const prevArchive =
      history.find((h) => h && h.start === expectedPrev) ||
      history
        .filter((h) => h && ISO_RE.test(h.start) && h.start < cycleStart)
        .sort((a, b) => b.start.localeCompare(a.start))[0] ||
      null;

    if (prevArchive) {
      const pInc = r2(prevArchive.income);
      const pExp = r2(prevArchive.expense);
      const pSav = r2(prevArchive.savings);
      previous = {
        key: prevArchive.start,
        label: formatShortDate(prevArchive.start),
        income: pInc,
        expense: pExp,
        savings: pSav,
        net: r2(pInc - pExp - pSav),
        hasData: true
      };
    } else {
      previous = {
        key: expectedPrev,
        label: formatShortDate(expectedPrev),
        income: 0,
        expense: 0,
        savings: 0,
        net: 0,
        hasData: false
      };
    }
  }

  const deltas = {
    income: r2(current.income - previous.income),
    expense: r2(current.expense - previous.expense),
    savings: r2(current.savings - previous.savings)
  };

    expense: calcPctChange(current.expense, previous.expense),
    savings: calcPctChange(current.savings, previous.savings)
  };

  };
}

  const p4 = polarToCartesian(cx, cy, innerR, endAngle);
  const largeArc = endAngle - startAngle > 180 ? 1 : 0;

  return [
    `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`,
    `A ${outerR} ${outerR} 0 ${largeArc} 0 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`,
    `L ${p3.x.toFixed(2)} ${p3.y.toFixed(2)}`,
    `A ${innerR} ${innerR} 0 ${largeArc} 1 ${p4.x.toFixed(2)} ${p4.y.toFixed(2)}`,

}

/**

  { mode = "add", tx = null, defaultType = "expense", onSubmit, onAddCategory } = {}
) {

  const validTypes = REGULAR_TYPE_OPTIONS.map((o) => o.value);

    ? tx.type

  const initialChannel = CHANNELS.includes(tx?.channel) ? tx.channel : CHANNELS[0];

                  type="button"
                  class="seg-btn ${activeType === opt.value ? "active" : ""}"
                  data-tx-type="${esc(opt.value)}"
                >${esc(opt.label)}</button>
              `
            ).join("")}
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label class="field-label" for="txAmountInput">จำนวนเงิน (บาท)</label>
            <div class="input-group">
              <span class="input-prefix">฿</span>
              <input
                id="txAmountInput"
                type="number"
                step="0.01"
                min="0.01"
                inputmode="decimal"
                class="input tabular-nums"
                placeholder="0.00"
                value="${esc(initialAmount)}"
                required
                autofocus
              />
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="txDateInput">วันที่</label>
            <input
              id="txDateInput"
              type="date"
              class="input tabular-nums"
              value="${esc(initialDate)}"
              required
            />

          <div class="field">
            <label class="field-label" for="txChannelInput">บัญชี / ช่องทาง</label>
            <select id="txChannelInput" class="select">
              ${CHANNELS.map(
                (ch) =>
                  `<option value="${esc(ch)}"${initialChannel === ch ? " selected" : ""}>${esc(ch)}</option>`
              ).join("")}
            </select>
          </div>

          <div class="field">
            <div class="row-between">
              <label class="field-label" for="txCategoryInput">หมวดหมู่</label>
              <button type="button" id="toggleAddCategoryBtn" class="btn btn-ghost btn-sm" style="height: auto; padding: 2px 6px; font-size: 0.75rem;">
                + เพิ่มหมวดหมู่
              </button>
            </div>
            <select id="txCategoryInput" class="select">
              ${categories
                .map(
                  (c) =>
                    `<option value="${esc(c)}"${initialCategory === c ? " selected" : ""}>${esc(c)}</option>`
                )
                .join("")}
            </select>
          </div>

          <div id="inlineCategoryBox" class="field full" hidden>
            <label class="field-label" for="inlineCategoryInput">ชื่อหมวดหมู่ใหม่</label>
            <div class="form-row">

                class="input input-sm"

              />
              <button type="button" id="confirmAddCategoryBtn" class="btn btn-primary btn-sm">เพิ่ม</button>
              <button type="button" id="cancelAddCategoryBtn" class="btn btn-ghost btn-sm">ยกเลิก</button>
            </div>
          </div>

          <div class="field full">
            <label class="field-label" for="txNoteInput">บันทึกเพิ่มเติม (ไม่บังคับ)</label>
            <input
              id="txNoteInput"
              type="text"
              class="input"
              placeholder="รายละเอียดเพิ่มเติม..."
              value="${esc(initialNote)}"
            />
          </div>
        </div>

        <div id="txModalError" class="field-error" role="alert" hidden></div>
      </div>

        <button type="button" class="btn btn-secondary" data-modal-close>ยกเลิก</button>
        <button type="submit" id="txSubmitBtn" class="btn btn-primary">
          ${isEdit ? "บันทึกการแก้ไข" : "บันทึกรายการ"}
        </button>

    </form>
  `;

  const dialog = openModal(html, { size: "md" });
  if (!dialog) return null;

  const form = dialog.querySelector("#txModalForm");
  const typeBtns = dialog.querySelectorAll("[data-tx-type]");
  const amountInput = dialog.querySelector("#txAmountInput");
  const dateInput = dialog.querySelector("#txDateInput");
  const channelInput = dialog.querySelector("#txChannelInput");
  const categorySelect = dialog.querySelector("#txCategoryInput");
  const noteInput = dialog.querySelector("#txNoteInput");
  const errorEl = dialog.querySelector("#txModalError");
  const submitBtn = dialog.querySelector("#txSubmitBtn");

  const toggleCatBtn = dialog.querySelector("#toggleAddCategoryBtn");
  const inlineCatBox = dialog.querySelector("#inlineCategoryBox");
  const inlineCatInput = dialog.querySelector("#inlineCategoryInput");
  const confirmCatBtn = dialog.querySelector("#confirmAddCategoryBtn");
  const cancelCatBtn = dialog.querySelector("#cancelAddCategoryBtn");

  const repopulateCategories = (preferName = "") => {
    const list = getCategoryList(state, activeType, preferName);
    categorySelect.innerHTML = list
      .map(
        (c) => `<option value="${esc(c)}"${c === preferName ? " selected" : ""}>${esc(c)}</option>`
      )
      .join("");
  };

  typeBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      const nextType = btn.getAttribute("data-tx-type");
      if (!validTypes.includes(nextType) || nextType === activeType) return;
      activeType = nextType;
      typeBtns.forEach((b) => b.classList.toggle("active", b === btn));

      showInlineError(errorEl, "");

    if (!name) {

      inlineCatInput.focus();
      return;
    }
    showInlineError(errorEl, "");
    await runWithBusy(confirmCatBtn, async () => {
      const res = typeof onAddCategory === "function" ? await onAddCategory(activeType, name) : true;
      if (res === false) return;
      repopulateCategories(name);

      inlineCatBox.hidden = true;
      inlineCatInput.value = "";
    });
  };

  confirmCatBtn?.addEventListener("click", handleCreateCategory);
  inlineCatInput?.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      handleCreateCategory();
    }
  });
