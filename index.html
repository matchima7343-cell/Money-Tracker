<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07120e">
  <title>MONEY-TRACK · Christmas Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/tokens.css">
  <link rel="stylesheet" href="./src/css/layout.css">
  <link rel="stylesheet" href="./src/css/components.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("money_track_theme_v2");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar Backdrop (Tablet / Mobile Drawer) -->
    <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Left Navigation Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="เมนูหลัก">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l2.4 4.2h-4.8L12 2z"></path>
            <path d="M12 5l5 6h-3l4 5H6l4-5H7l5-6z"></path>
            <path d="M12 16v5"></path>
            <path d="M9 21h6"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">MONEY-TRACK</span>
          <span class="brand-sub">✨ Luxury Christmas Gold</span>
        </div>
      </div>

      <div class="sidebar-cta">
        <button id="sidebarAddTxBtn" type="button" class="btn btn-primary btn-block">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          <span>จดรายการใหม่</span>
        </button>
      </div>

      <nav class="sidebar-nav" aria-label="หมวดหมู่หน้า">
        <div class="sidebar-section-label">ภาพรวมและการเงิน</div>

        <button type="button" class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
            <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
            <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
          </svg>
          <span>ภาพรวม</span>
        </button>

        <button type="button" class="nav-item" data-view="transactions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path>
          </svg>
          <span>รายการเงิน</span>
        </button>

        <button type="button" class="nav-item" data-view="budgets">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          <span>งบของฉัน</span>
        </button>

        <button type="button" class="nav-item" data-view="savings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"></path>
            <path d="M2 9v1c0 1.1.9 2 2 2h1"></path>
            <circle cx="16" cy="11" r="1"></circle>
          </svg>
          <span>ออม &amp; ประจำ</span>
        </button>

        <button type="button" class="nav-item" data-view="analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3v18h18"></path>
            <path d="m19 9-5 5-4-4-3 3"></path>
          </svg>
          <span>สรุปกราฟ</span>
        </button>

        <button type="button" class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>ตั้งค่า</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button id="sidebarSyncBtn" type="button" class="sidebar-util-btn" title="ซิงค์ข้อมูล GitHub Gist">
          <span class="sidebar-util-left">
            <span id="sidebarSyncDot" class="sync-dot" aria-hidden="true"></span>
            <span id="sidebarSyncText" class="truncate">ออฟไลน์ / ในเครื่อง</span>
          </span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 16h5v5"></path>
          </svg>
        </button>

        <button id="sidebarThemeBtn" type="button" class="sidebar-util-btn" title="สลับโหมดสี Dark / Light">
          <span class="sidebar-util-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2m-7.07-15.07 1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2m-15.07 7.07 1.41-1.41M17.66 6.34l1.41-1.41"></path>
            </svg>
            <span id="sidebarThemeLabel">โหมดมืด</span>
          </span>
          <span class="badge badge-neutral">ธีม</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Column -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="topbar-left">
            <button id="mobileMenuBtn" type="button" class="mobile-menu-btn" aria-label="เปิดเมนูนำทาง" aria-controls="sidebar" aria-expanded="false">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>

            <div class="topbar-heading">
              <h1 id="viewTitle" class="view-title">ภาพรวม</h1>
              <span id="cycleRangePill" class="cycle-range-pill" title="รอบสัปดาห์ (เสาร์–ศุกร์)">เสาร์–ศุกร์</span>
            </div>
          </div>

          <div class="topbar-actions">
            <button id="topbarSyncBtn" type="button" class="sync-pill" title="สถานะการซิงค์ข้อมูล">
              <span id="topbarSyncDot" class="sync-dot" aria-hidden="true"></span>
              <span id="topbarSyncText">ในเครื่อง</span>
            </button>

            <button id="topbarThemeBtn" type="button" class="btn-icon" aria-label="สลับโหมดสี Dark / Light" title="สลับโหมดสี Dark / Light">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>

            <button id="topbarAddTxBtn" type="button" class="btn btn-primary">
              <span>+ เพิ่มรายการ</span>
            </button>
          </div>
        </div>
      </header>

      <main class="main-content">
        <!-- Rollover Notification Banner (Hidden by default) -->
        <div id="rolloverBanner" class="rollover-banner" role="status" hidden>
          <div class="rollover-banner-content">
            <div class="rollover-banner-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
              </svg>
            </div>
            <p id="rolloverBannerText">ระบบได้ปิดรอบสัปดาห์ก่อนหน้าและทบยอดคงเหลือเรียบร้อยแล้ว</p>
          </div>
          <div class="rollover-banner-actions">
            <button id="undoRolloverBtn" type="button" class="btn btn-secondary btn-sm">กู้คืนก่อนทบยอด</button>
            <button id="dismissRolloverBtn" type="button" class="btn btn-primary btn-sm">รับทราบ</button>
          </div>
        </div>

        <!-- 6 Primary View Containers -->
        <section id="view-dashboard" class="view-panel active" aria-labelledby="viewTitle"></section>
        <section id="view-transactions" class="view-panel" aria-labelledby="viewTitle"></section>
        <section id="view-budgets" class="view-panel" aria-labelledby="viewTitle"></section>
        <section id="view-savings" class="view-panel" aria-labelledby="viewTitle"></section>
        <section id="view-analytics" class="view-panel" aria-labelledby="viewTitle"></section>
        <section id="view-settings" class="view-panel" aria-labelledby="viewTitle"></section>
      </main>
    </div>

    <!-- Mobile Bottom Navigation (< 768px) -->
    <nav class="mobile-bottom-nav" aria-label="เมนูนำทางมือถือ">
      <button type="button" class="mobile-nav-btn active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
          <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
          <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
          <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
        </svg>
        <span>ภาพรวม</span>
      </button>

      <button type="button" class="mobile-nav-btn" data-view="transactions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path>
        </svg>
        <span>รายการ</span>
      </button>

      <button type="button" class="mobile-nav-btn" data-view="budgets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        <span>งบ</span>
      </button>

      <button type="button" class="mobile-nav-btn" data-view="savings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"></path>
          <circle cx="16" cy="11" r="1"></circle>
        </svg>
        <span>ออม</span>
      </button>

      <button type="button" class="mobile-nav-btn" data-view="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3v18h18"></path>
          <path d="m19 9-5 5-4-4-3 3"></path>
        </svg>
        <span>กราฟ</span>
      </button>

      <button type="button" class="mobile-nav-btn" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>ตั้งค่า</span>
      </button>
    </nav>
  </div>

  <!-- Overlays & Global Feedback Containers -->
  <div id="modalRoot"></div>
  <div id="chartTooltip" class="chart-tooltip" role="tooltip" hidden></div>
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script defer src="./dist/app.bundle.js"></script>
</body>
</html>
