    e.preventDefault();
    const amount = r2(amountInput.value);
    const date = String(dateInput.value || "").trim();
    const channel = channelInput.value;
    const category = String(categorySelect.value || "").trim();
    const note = String(noteInput.value || "").trim();

    if (!Number.isFinite(amount) || amount <= 0) {
      showInlineError(errorEl, "กรุณาระบุจำนวนเงินที่มากกว่า 0");
      amountInput.focus();
      return;
    }
    if (!ISO_RE.test(date)) {
      showInlineError(errorEl, "กรุณาเลือกวันที่ให้ถูกต้อง");
      dateInput.focus();
      return;
    }
    if (!category) {
      showInlineError(errorEl, "กรุณาเลือกหมวดหมู่");
      categorySelect.focus();
      return;
    }

    showInlineError(errorEl, "");
    await runWithBusy(submitBtn, async () => {
      const result = await onSubmit?.({
        type: activeType,
        amount,
        date,
        channel,
        category,
        note
      });
      if (result !== false) {
        closeModal();
      }
    });
  });

  return dialog;
}

    : CHANNELS[0];
  const initialTo =
    CHANNELS.includes(tx?.toChannel) && tx.toChannel !== initialFrom
      ? tx.toChannel
      : CHANNELS.find((c) => c !== initialFrom) || CHANNELS[1];
  const initialDate = isEdit && ISO_RE.test(tx?.date || "") ? tx.date : todayISO;
  const initialAmount = isEdit && Number(tx?.amount) > 0 ? String(tx.amount) : "";
  const initialNote = isEdit ? String(tx?.note || "") : "";

  const html = `
    ${renderModalHeader(isEdit ? "แก้ไขการย้ายเงิน" : "ย้ายเงินระหว่างบัญชี")}
    <form id="transferModalForm" novalidate>
      <div class="modal-body stack-md">
        <div class="grid-2" style="gap: 10px;">
          <div class="card" style="padding: 12px 14px; background: var(--bg-surface-2);">
            <div class="text-muted" style="font-size: 0.74rem;">ยอดคงเหลือต้นทาง</div>
            <div id="transferFromBal" class="tabular-nums" style="font-weight: 700; font-size: 1rem; margin-top: 2px;"></div>
          </div>
          <div class="card" style="padding: 12px 14px; background: var(--bg-surface-2);">
            <div class="text-muted" style="font-size: 0.74rem;">ยอดคงเหลือปลายทาง</div>
            <div id="transferToBal" class="tabular-nums" style="font-weight: 700; font-size: 1rem; margin-top: 2px;"></div>
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label class="field-label" for="transferFromSelect">จากบัญชี</label>
            <select id="transferFromSelect" class="select">
              ${CHANNELS.map(
                (ch) =>
                  `<option value="${esc(ch)}"${initialFrom === ch ? " selected" : ""}>${esc(ch)}</option>`
              ).join("")}
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="transferToSelect">ไปยังบัญชี</label>
            <select id="transferToSelect" class="select">
              ${CHANNELS.map(
                (ch) =>
                  `<option value="${esc(ch)}"${initialTo === ch ? " selected" : ""}>${esc(ch)}</option>`
              ).join("")}
            </select>
          </div>

          <div class="full" style="display: flex; justify-content: center;">
            <button type="button" id="swapTransferChannelsBtn" class="btn btn-secondary btn-sm">
              ⇄ สลับบัญชีต้นทาง / ปลายทาง
            </button>
          </div>

          <div class="field">
            <label class="field-label" for="transferAmountInput">จำนวนเงิน (บาท)</label>
            <div class="input-group">
              <span class="input-prefix">฿</span>
              <input
                id="transferAmountInput"
                type="number"
                step="0.01"
                min="0.01"
                inputmode="decimal"
                class="input tabular-nums"
                placeholder="0.00"
                value="${esc(initialAmount)}"
                required
                autofocus
              />
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="transferDateInput">วันที่</label>
            <input
              id="transferDateInput"
              type="date"
              class="input tabular-nums"
              value="${esc(initialDate)}"
              required
            />
          </div>

          <div class="field full">
            <label class="field-label" for="transferNoteInput">หมายเหตุ (ไม่บังคับ)</label>
            <input
              id="transferNoteInput"
              type="text"
              class="input"
              placeholder="เช่น เติม TrueMoney..."
              value="${esc(initialNote)}"
            />
          </div>
        </div>

        <div id="transferModalError" class="field-error" role="alert" hidden></div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close>ยกเลิก</button>
        <button type="submit" id="transferSubmitBtn" class="btn btn-primary">
          ${isEdit ? "บันทึกการแก้ไข" : "ยืนยันย้ายเงิน"}
        </button>
      </div>
    </form>
  `;

  const dialog = openModal(html, { size: "md" });
  if (!dialog) return null;

  const form = dialog.querySelector("#transferModalForm");
  const fromSelect = dialog.querySelector("#transferFromSelect");
  const toSelect = dialog.querySelector("#transferToSelect");
  const fromBalEl = dialog.querySelector("#transferFromBal");
  const toBalEl = dialog.querySelector("#transferToBal");
  const swapBtn = dialog.querySelector("#swapTransferChannelsBtn");
  const amountInput = dialog.querySelector("#transferAmountInput");
  const dateInput = dialog.querySelector("#transferDateInput");
  const noteInput = dialog.querySelector("#transferNoteInput");
  const errorEl = dialog.querySelector("#transferModalError");
  const submitBtn = dialog.querySelector("#transferSubmitBtn");

  const syncLiveBalances = () => {
    const fromCh = fromSelect.value;
    const toCh = toSelect.value;
    const fromBal = metrics.ch[fromCh]?.bal ?? 0;
    const toBal = metrics.ch[toCh]?.bal ?? 0;
    fromBalEl.textContent = `${fromCh}: ${formatTHB(fromBal)}`;
    fromBalEl.className = `tabular-nums ${fromBal < 0 ? "text-expense" : ""}`;
    toBalEl.textContent = `${toCh}: ${formatTHB(toBal)}`;
    toBalEl.className = `tabular-nums ${toBal < 0 ? "text-expense" : ""}`;
  };

  syncLiveBalances();

  fromSelect?.addEventListener("change", () => {
    if (fromSelect.value === toSelect.value) {
      toSelect.value = CHANNELS.find((c) => c !== fromSelect.value) || CHANNELS[0];
    }
    syncLiveBalances();
    showInlineError(errorEl, "");
  });

  toSelect?.addEventListener("change", () => {
    if (toSelect.value === fromSelect.value) {
      fromSelect.value = CHANNELS.find((c) => c !== toSelect.value) || CHANNELS[0];
    }
    syncLiveBalances();
    showInlineError(errorEl, "");
  });

  swapBtn?.addEventListener("click", () => {
    const prevFrom = fromSelect.value;
    fromSelect.value = toSelect.value;
    toSelect.value = prevFrom;
    syncLiveBalances();
    showInlineError(errorEl, "");
  });

  form?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fromChannel = fromSelect.value;
    const toChannel = toSelect.value;
    const amount = r2(amountInput.value);
    const date = String(dateInput.value || "").trim();
    const note = String(noteInput.value || "").trim();

    if (fromChannel === toChannel) {
      showInlineError(errorEl, "บัญชีต้นทางและปลายทางต้องไม่ซ้ำกัน");
      return;
    }
    if (!Number.isFinite(amount) || amount <= 0) {
      showInlineError(errorEl, "กรุณาระบุจำนวนเงินที่มากกว่า 0");
      amountInput.focus();
      return;
    }
    if (!ISO_RE.test(date)) {
      showInlineError(errorEl, "กรุณาเลือกวันที่ให้ถูกต้อง");
      dateInput.focus();
      return;
    }

    showInlineError(errorEl, "");
    await runWithBusy(submitBtn, async () => {
      const result = await onSubmit?.({ amount, date, fromChannel, toChannel, note });
      if (result !== false) closeModal();
    });
  });

  return dialog;
}

/**
 * Open modal to customize Quick Income (2 buttons) or Quick Save (3 buttons) amounts.
 */
function openQuickAmountsModal(state, key, onSave) {
  const isSave = key === "quickSaveAmounts";
  const count = isSave ? 3 : 2;
  const fallback = isSave ? [100, 200, 500] : [500, 1000];
  const current = Array.isArray(state?.[key]) && state[key].length === count ? state[key] : fallback;

  const html = `
    ${renderModalHeader(isSave ? "ตั้งค่ายอดออมเงินด่วน" : "ตั้งค่ายอดรายรับด่วน")}
    <form id="quickAmountsForm" novalidate>
      <div class="modal-body stack-md">
        <p class="text-secondary" style="font-size: 0.85rem;">
          กำหนดจำนวนเงินสำหรับปุ่มบันทึกรวดเร็ว (${count} ปุ่ม)
        </p>
        <div class="stack-sm">
          ${current
            .map(
              (val, i) => `
                <div class="field">
                  <label class="field-label" for="quickAmtInput_${i}">ปุ่มที่ ${i + 1}</label>
                  <div class="input-group">
                    <span class="input-prefix">฿</span>
                    <input
                      id="quickAmtInput_${i}"
                      data-quick-index="${i}"
                      type="number"
                      step="1"
                      min="1"
                      inputmode="decimal"
                      class="input tabular-nums"
                      value="${esc(String(val))}"
                      required
                      ${i === 0 ? "autofocus" : ""}
                    />
                  </div>
                </div>
              `
            )
            .join("")}
        </div>
        <div id="quickAmountsError" class="field-error" role="alert" hidden></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close>ยกเลิก</button>
        <button type="submit" id="quickAmountsSaveBtn" class="btn btn-primary">บันทึก</button>
      </div>
    </form>
  `;

  const dialog = openModal(html, { size: "sm" });
  if (!dialog) return null;

  const form = dialog.querySelector("#quickAmountsForm");
  const inputs = Array.from(dialog.querySelectorAll("[data-quick-index]"));
  const errorEl = dialog.querySelector("#quickAmountsError");
  const submitBtn = dialog.querySelector("#quickAmountsSaveBtn");

  form?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const values = [];
    for (const input of inputs) {
      const v = r2(input.value);
      if (!Number.isFinite(v) || v <= 0) {
        showInlineError(errorEl, "ทุกช่องต้องเป็นจำนวนเงินที่มากกว่า 0");
        input.focus();
        return;
      }
      values.push(v);
    }
    showInlineError(errorEl, "");
    await runWithBusy(submitBtn, async () => {
      const res = await onSave?.(values);
      if (res !== false) closeModal();
    });
  });

  return dialog;
}

/**
 * Open read-only detail modal inspecting an archived week and its transactions.
 */
function openWeekDetailModal(weekArchive) {
  if (!weekArchive) return null;

  const startISO = weekArchive.start || "";
  const endISO = ISO_RE.test(startISO) ? addDaysISO(startISO, 6) : "";
  const rangeTitle = endISO
    ? `สัปดาห์ ${formatShortDate(startISO, true)} – ${formatShortDate(endISO, true)}`
    : "รายละเอียดสัปดาห์";

  const txs = [...(Array.isArray(weekArchive.transactions) ? weekArchive.transactions : [])].sort(
    (a, b) => String(b?.date || "").localeCompare(String(a?.date || ""))
  );

  const html = `
    ${renderModalHeader(rangeTitle)}
    <div class="modal-body stack-md">
      <div class="grid-4" style="gap: 10px;">
        <div class="card" style="padding: 10px 12px; background: var(--bg-surface-2);">
          <div class="text-muted" style="font-size: 0.72rem;">ทบเข้า</div>
          <div class="tabular-nums" style="font-weight: 700;">${formatTHB(weekArchive.rolloverIn)}</div>
        </div>
        <div class="card" style="padding: 10px 12px; background: var(--bg-surface-2);">
          <div class="text-muted" style="font-size: 0.72rem;">รายรับ</div>
          <div class="tabular-nums text-income" style="font-weight: 700;">${formatTHB(weekArchive.income)}</div>
        </div>
        <div class="card" style="padding: 10px 12px; background: var(--bg-surface-2);">
          <div class="text-muted" style="font-size: 0.72rem;">รายจ่าย</div>
          <div class="tabular-nums text-expense" style="font-weight: 700;">${formatTHB(weekArchive.expense)}</div>
        </div>
        <div class="card" style="padding: 10px 12px; background: var(--bg-surface-2);">
          <div class="text-muted" style="font-size: 0.72rem;">ทบออก (ออม ${formatTHB(weekArchive.savings)})</div>
          <div class="tabular-nums ${weekArchive.rolloverOut < 0 ? "text-expense" : ""}" style="font-weight: 700;">
            ${formatTHB(weekArchive.rolloverOut)}
          </div>
        </div>
      </div>

      ${
        txs.length > 0
          ? `
            <div class="tx-list">
              ${txs
                .map((tx) => {
                  const title =
                    tx.type === "transfer"
                      ? `${esc(tx.fromChannel || tx.channel)} → ${esc(tx.toChannel)}`
                      : esc(tx.category || "อื่นๆ");
                  const amtText =
                    tx.type === "income"
                      ? `+${formatTHB(tx.amount)}`
                      : tx.type === "transfer"
                        ? formatTHB(tx.amount)
                        : `-${formatTHB(tx.amount)}`;
                  return `
                    <div class="tx-row">
                      <div class="tx-left">
                        <div class="tx-main">
                          <div class="tx-title">${title}</div>
                          <div class="tx-meta">
                            <span class="tabular-nums">${esc(formatShortDate(tx.date, true))}</span>
                            <span>· ${esc(tx.type === "transfer" ? "โอนย้าย" : tx.channel || "")}</span>
                            ${tx.note ? `<span>· ${esc(tx.note)}</span>` : ""}
                          </div>
                        </div>
                      </div>
                      <div class="tx-right">
                        <div class="tx-amount ${esc(tx.type)} tabular-nums">${amtText}</div>
                      </div>
                    </div>
                  `;
                })
                .join("")}
            </div>
          `
          : `
            <div class="empty-state">
              <div class="empty-title">ไม่มีรายการธุรกรรมในสัปดาห์นี้</div>

      }
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-primary" data-modal-close>ปิด</button>

  return openModal(html, { size: "lg" });
}

        }
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close>ปิด</button>
        <button type="submit" id="syncSaveConnectBtn" class="btn btn-primary">
          ${isConnected ? "บันทึก & ซิงก์" : "เชื่อมต่อและซิงก์"}
        </button>
      </div>
    </form>
  `;

  const dialog = openModal(html, { size: "md" });
  if (!dialog) return null;

  const form = dialog.querySelector("#syncModalForm");
  const tokenInput = dialog.querySelector("#syncTokenInput");
  const gistInput = dialog.querySelector("#syncGistIdInput");
  const errorEl = dialog.querySelector("#syncModalError");
  const saveBtn = dialog.querySelector("#syncSaveConnectBtn");
  const syncNowBtn = dialog.querySelector("#syncNowBtn");
  const pushBtn = dialog.querySelector("#syncPushBtn");
  const disconnectBtn = dialog.querySelector("#syncDisconnectBtn");

  form?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const enteredToken = String(tokenInput.value || "").trim();
    const gistId = String(gistInput.value || "").trim();

    if (!enteredToken && !isConnected) {
      showInlineError(errorEl, "กรุณากรอก GitHub Personal Access Token");
      tokenInput.focus();
      return;
    }

    showInlineError(errorEl, "");
    await runWithBusy(saveBtn, async () => {
      const tokenToUse = enteredToken || syncController?.getConfig?.()?.token || "";
      const ok = await syncController?.connect?.({ token: tokenToUse, gistId });
      await onAfterSync?.();
      if (ok) closeModal();
    });
  });

  syncNowBtn?.addEventListener("click", async () => {
    await runWithBusy(syncNowBtn, async () => {
      const ok = await syncController?.syncWithCloud?.(false);
      await onAfterSync?.();
      if (ok) closeModal();
    });
  });

  pushBtn?.addEventListener("click", async () => {
    await runWithBusy(pushBtn, async () => {
      const ok = await syncController?.pushToCloud?.(false);
      await onAfterSync?.();
      if (ok) closeModal();
    });
  });

  disconnectBtn?.addEventListener("click", async () => {
    syncController?.disconnect?.();
    await onAfterSync?.();
    closeModal();
  });

  return dialog;
}

  const currentInput = dialog.querySelector("#goalCurrentInput");
  const dateInput = dialog.querySelector("#goalDateInput");
  const channelSelect = dialog.querySelector("#goalChannelInput");
  const colorBtns = dialog.querySelectorAll("[data-goal-color]");
  const errorEl = dialog.querySelector("#goalModalError");
  const submitBtn = dialog.querySelector("#goalSubmitBtn");

      colorBtns.forEach((b) => b.classList.toggle("active", b === btn));
    });
  });

  form?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = String(nameInput.value || "").trim();
    const targetAmount = r2(targetInput.value);
    const currentAmount = r2(currentInput.value);
    const targetDate = String(dateInput.value || "").trim();
    const channel = channelSelect.value;

    if (!name) {
      showInlineError(errorEl, "กรุณาระบุชื่อเป้าหมาย");
      nameInput.focus();
      return;
    }
    if (!Number.isFinite(targetAmount) || targetAmount <= 0) {
      showInlineError(errorEl, "ยอดเป้าหมายต้องมากกว่า 0");
      targetInput.focus();
      return;
    }
    if (!Number.isFinite(currentAmount) || currentAmount < 0) {
      showInlineError(errorEl, "ยอดออมปัจจุบันต้องตั้งแต่ 0 ขึ้นไป");
      currentInput.focus();
      return;
    }

    showInlineError(errorEl, "");
    await runWithBusy(submitBtn, async () => {
      const res = await onSubmit?.({
        name,
        targetAmount,
        currentAmount,
        targetDate: ISO_RE.test(targetDate) ? targetDate : "",
        channel,
        color: selectedColor
      });
      if (res !== false) closeModal();
    });
  });

  return dialog;
}

/**
 * Open Add/Edit Recurring Transaction Rule modal.
 */
function openRecurringModal(state, { rule = null, onSubmit } = {}) {
  const isEdit = Boolean(rule);
  const validTypes = REGULAR_TYPE_OPTIONS.map((o) => o.value);
  let activeType = validTypes.includes(rule?.type) ? rule.type : "expense";
  const todayISO = toLocalISODate(new Date());

  const initialAmount = isEdit && Number(rule?.amount) > 0 ? String(rule.amount) : "";
  const initialFreq = RECURRING_FREQUENCIES.includes(rule?.frequency)
    ? rule.frequency
    : "monthly";
  const initialChannel = CHANNELS.includes(rule?.channel) ? rule.channel : CHANNELS[0];
  const initialCategory = isEdit ? String(rule?.category || "") : "";
  const initialStart = isEdit && ISO_RE.test(rule?.startDate || "") ? rule.startDate : todayISO;
  const initialNext = isEdit && ISO_RE.test(rule?.nextDueDate || "") ? rule.nextDueDate : initialStart;
  const initialNote = isEdit ? String(rule?.note || "") : "";
  const initialActive = isEdit ? rule.active !== false : true;

          <div class="segmented" role="group" aria-label="ประเภทรายการประจำ">

                  class="seg-btn ${activeType === opt.value ? "active" : ""}"
                  data-rec-type="${esc(opt.value)}"

            <div class="input-group">
              <span class="input-prefix">฿</span>
              <input
                id="recAmountInput"
                type="number"
                step="0.01"
                min="0.01"
                inputmode="decimal"
                class="input tabular-nums"
                placeholder="0.00"
                value="${esc(initialAmount)}"
                required
                autofocus
              />
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="recFrequencyInput">ความถี่</label>
            <select id="recFrequencyInput" class="select">
              ${RECURRING_FREQUENCIES.map(
                (f) =>
                  `<option value="${esc(f)}"${initialFreq === f ? " selected" : ""}>${esc(FREQUENCY_LABELS[f] || f)}</option>`
              ).join("")}
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="recChannelInput">บัญชี / ช่องทาง</label>
            <select id="recChannelInput" class="select">
              ${CHANNELS.map(
                (ch) =>
                  `<option value="${esc(ch)}"${initialChannel === ch ? " selected" : ""}>${esc(ch)}</option>`
              ).join("")}
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="recCategoryInput">หมวดหมู่</label>
            <select id="recCategoryInput" class="select">
              ${categories
                .map(
                  (c) =>
                    `<option value="${esc(c)}"${initialCategory === c ? " selected" : ""}>${esc(c)}</option>`
                )
                .join("")}
            </select>

          <div class="field">
            <label class="field-label" for="recStartDateInput">วันที่เริ่มต้น</label>
            <input
              id="recStartDateInput"
              type="date"
              class="input tabular-nums"
              value="${esc(initialStart)}"
              required
            />
          </div>

          <div class="field">
            <label class="field-label" for="recNextDueInput">วันครบกำหนดถัดไป</label>
            <input
              id="recNextDueInput"
              type="date"
              class="input tabular-nums"
              value="${esc(initialNext)}"
              required
            />
          </div>

          <div class="field full">
            <label class="field-label" for="recNoteInput">บันทึกเพิ่มเติม (ไม่บังคับ)</label>
            <input
              id="recNoteInput"
              type="text"
              class="input"
              placeholder="เช่น ค่าเช่าห้อง, เน็ตบ้าน..."
              value="${esc(initialNote)}"
            />
          </div>
        </div>

        <label class="checkbox-row">
          <input id="recActiveCheck" type="checkbox"${initialActive ? " checked" : ""} />
          <span>เปิดใช้งานรายการประจำนี้</span>
        </label>

        <div id="recModalError" class="field-error" role="alert" hidden></div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close>ยกเลิก</button>
        <button type="submit" id="recSubmitBtn" class="btn btn-primary">
          ${isEdit ? "บันทึกการแก้ไข" : "บันทึกรายการประจำ"}
        </button>
      </div>
    </form>
  `;

  const dialog = openModal(html, { size: "md" });
  if (!dialog) return null;

  const form = dialog.querySelector("#recModalForm");
  const typeBtns = dialog.querySelectorAll("[data-rec-type]");
  const amountInput = dialog.querySelector("#recAmountInput");
  const freqSelect = dialog.querySelector("#recFrequencyInput");
  const channelSelect = dialog.querySelector("#recChannelInput");
  const categorySelect = dialog.querySelector("#recCategoryInput");
  const startInput = dialog.querySelector("#recStartDateInput");
  const nextInput = dialog.querySelector("#recNextDueInput");
  const noteInput = dialog.querySelector("#recNoteInput");
  const activeCheck = dialog.querySelector("#recActiveCheck");
  const errorEl = dialog.querySelector("#recModalError");
  const submitBtn = dialog.querySelector("#recSubmitBtn");

  let nextEditedManually = isEdit;

  typeBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      const nextType = btn.getAttribute("data-rec-type");
      if (!validTypes.includes(nextType) || nextType === activeType) return;
      activeType = nextType;
      typeBtns.forEach((b) => b.classList.toggle("active", b === btn));
      const list = getCategoryList(
        state,
        activeType,
        isEdit && rule?.type === activeType ? rule.category : ""
      );
      categorySelect.innerHTML = list
        .map((c) => `<option value="${esc(c)}">${esc(c)}</option>`)
        .join("");
    });
  });

  startInput?.addEventListener("change", () => {
    if (!nextEditedManually && ISO_RE.test(startInput.value)) {
      nextInput.value = startInput.value;
    }
  });

  nextInput?.addEventListener("input", () => {
    nextEditedManually = true;
  });

  form?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const amount = r2(amountInput.value);
    const frequency = freqSelect.value;
    const channel = channelSelect.value;
    const category = String(categorySelect.value || "").trim();
    const startDate = String(startInput.value || "").trim();
    const nextDueDate = String(nextInput.value || "").trim();
    const note = String(noteInput.value || "").trim();
    const active = Boolean(activeCheck.checked);

    if (!Number.isFinite(amount) || amount <= 0) {
      showInlineError(errorEl, "กรุณาระบุจำนวนเงินที่มากกว่า 0");
      amountInput.focus();
      return;
    }
    if (!ISO_RE.test(startDate)) {
      showInlineError(errorEl, "กรุณาเลือกวันที่เริ่มต้นให้ถูกต้อง");
      startInput.focus();
      return;
    }
    if (!ISO_RE.test(nextDueDate)) {
      showInlineError(errorEl, "กรุณาเลือกวันครบกำหนดถัดไปให้ถูกต้อง");
      nextInput.focus();
      return;
    }

    showInlineError(errorEl, "");
    await runWithBusy(submitBtn, async () => {
      const res = await onSubmit?.({
        type: activeType,
        amount,
        frequency,
        channel,
        category,
        startDate,
        nextDueDate,
        note,
        active
      });
      if (res !== false) closeModal();
    });
  });

  return dialog;
}

        message: `ต้องการลบเป้าหมาย "${goal.name}" ใช่หรือไม่? (รายการออมที่บันทึกไว้ในบัญชีจะยังคงอยู่)`,
        confirmText: "ลบเป้าหมาย",
        danger: true
      });
      if (!ok) return;
      deleteGoal(state, id);
      persistAndRender();
      showToast("ลบเป้าหมายการออมแล้ว", "success");
      break;
    }
    case "contribute-goal": {
      const id = el.getAttribute("data-id");
      const goal = state.goals.find((g) => g.id === id);
      if (!goal) return;
      openGoalContributeModal(state, goal, ({ amount, date, channel, note, recordTransaction }) => {
        const res = contributeToGoal(state, id, amount, {
          date,
          channel,
          note,
          recordTransaction
        });
        if (!res) return false;
        persistAndRender();
        showToast(`เติมเงินเข้า "${goal.name}" จำนวน ${formatTHB(amount)} แล้ว`, "success");
        return true;
      });
      break;
    }
    case "open-add-recurring": {
      openRecurringModal(state, {
        onSubmit: (payload) => {
          const rule = createRecurring(state, payload);
          if (!rule) return false;
          const applied = applyDueRecurring(state, new Date());
          persistAndRender();
          showToast(
            applied.createdCount > 0
              ? `บันทึกรายการประจำและสร้างรายการที่ถึงกำหนด ${applied.createdCount} รายการแล้ว`
              : "บันทึกรายการประจำเรียบร้อยแล้ว",
            "success"
          );
          return true;
        }
      });
      break;
    }
    case "edit-recurring": {
      const id = el.getAttribute("data-id");
      const rule = state.recurring.find((r) => r.id === id);
      if (!rule) return;
      openRecurringModal(state, {
        rule,
        onSubmit: (payload) => {
          updateRecurring(state, id, payload);
          const applied = applyDueRecurring(state, new Date());
          persistAndRender();
          showToast(
            applied.createdCount > 0
              ? `อัปเดตรายการประจำและสร้างรายการถึงกำหนด ${applied.createdCount} รายการแล้ว`
              : "อัปเดตรายการประจำแล้ว",
            "success"
          );
          return true;
        }
      });
      break;
    }
    case "del-recurring": {
      const id = el.getAttribute("data-id");
      const rule = state.recurring.find((r) => r.id === id);
      if (!rule) return;
      const ok = await confirmDialog({
        title: "ลบรายการประจำ",
        message: `ต้องการลบรายการประจำ "${rule.category}" (${formatTHB(rule.amount)}) ใช่หรือไม่?`,
        confirmText: "ลบรายการประจำ",
        danger: true
      });
      if (!ok) return;
      deleteRecurring(state, id);
      persistAndRender();
      showToast("ลบรายการประจำแล้ว", "success");
      break;
    }
    case "set-analytics-mode": {
      const mode = el.getAttribute("data-mode");
      uiState.analyticsMode = mode === "monthly" ? "monthly" : "weekly";
      renderCurrentView();
      break;
    }
    case "toggle-theme": {
      const next = uiState.theme === "dark" ? "light" : "dark";
      applyTheme(next);
      renderCurrentView();
      showToast(
        next === "dark" ? "เปลี่ยนเป็นโหมดมืด (Dark Mode) แล้ว" : "เปลี่ยนเป็นโหมดสว่าง (Light Mode) แล้ว",
        "info"
      );
      break;
    }
    case "del-category": {
      const type = el.getAttribute("data-type");
      const name = el.getAttribute("data-name");
      const list = state.categories?.[type];
      if (!Array.isArray(list) || list.length <= 1) {
        showToast("ต้องเหลืออย่างน้อย 1 หมวดหมู่ในแต่ละประเภท", "warning");
        return;
      }
      const ok = await confirmDialog({
        title: "ลบหมวดหมู่",
        message: `ต้องการลบหมวดหมู่ "${name}" ใช่หรือไม่?`,
        confirmText: "ลบหมวดหมู่",
        danger: true
      });
      if (!ok) return;
      state.categories[type] = list.filter((c) => c !== name);
      if (type === "expense" && state.categoryBudgets[name]) {
        delete state.categoryBudgets[name];
      }
      persistAndRender();
      showToast(`ลบหมวดหมู่ "${name}" แล้ว`, "success");
      break;
    }
    case "open-sync": {
      openSyncModal(syncController, () => {
        renderCurrentView();
      });
      break;
    }
    case "sync-now": {
      const cfg = syncController?.getConfig?.();
      if (!cfg?.token) {
        openSyncModal(syncController, () => renderCurrentView());
      } else {
        await syncController.syncWithCloud(false);
        renderCurrentView();
      }
      break;
    }
    case "export-json": {
      const payload = createBackupPayload(state);
      triggerDownload(
        `money-track-backup-${toLocalISODate(new Date())}.json`,
        JSON.stringify(payload, null, 2),
        "application/json"
      );
      showToast("ดาวน์โหลดไฟล์สำรอง JSON แล้ว", "success");
      break;
    }
    case "export-csv-week": {
      const csv = buildCSVContent(state.transactions);
      triggerDownload(
        `money-track-week-${state.cycleStartISO}.csv`,
        csv,
        "text/csv;charset=utf-8"
      );
      showToast("ดาวน์โหลดไฟล์ CSV สัปดาห์นี้แล้ว", "success");
      break;
    }
    case "export-csv-all": {
      const csv = buildCSVContent(getAllUniqueTransactions(state));
      triggerDownload(
        `money-track-all-${toLocalISODate(new Date())}.csv`,
        csv,
        "text/csv;charset=utf-8"
      );
      showToast("ดาวน์โหลดไฟล์ CSV ทั้งหมดแล้ว", "success");
      break;
    }
    case "trigger-import-json": {
      $("settingsImportFile")?.click();
      break;
    }
    case "apply-import": {
      if (!uiState.pendingImport?.state) return;
      const ok = await confirmDialog({
        title: "ยืนยันกู้คืนข้อมูล",
        message: "ข้อมูลปัจจุบันในเครื่องนี้จะถูกแทนที่ด้วยข้อมูลจากไฟล์สำรอง ต้องการดำเนินการต่อหรือไม่?",
        confirmText: "กู้คืนข้อมูล",
        danger: true
      });
      if (!ok) return;
      state = sanitizeState(uiState.pendingImport.state);
      uiState.pendingImport = null;
      persistAndRender();
      runLifecycleChecks();
      showToast("กู้คืนข้อมูลจากไฟล์สำรองเรียบร้อยแล้ว", "success");
      break;
    }
    case "cancel-import": {
      uiState.pendingImport = null;
      renderCurrentView();
      break;
    }
    case "close-week": {
      const nextStart = addDaysISO(state.cycleStartISO, 7);
      const ok = await confirmDialog({
        title: "ปิดสัปดาห์ & ทบยอดไปสัปดาห์ถัดไป",
        message: `ระบบจะบันทึกรอบ ${formatShortDate(state.cycleStartISO)} – ${formatShortDate(addDaysISO(state.cycleStartISO, 6))} ลงในคลังประวัติ และทบยอดคงเหลือเข้าสู่รอบ ${formatShortDate(nextStart)} – ${formatShortDate(addDaysISO(nextStart, 6))}`,
        confirmText: "ยืนยันปิดสัปดาห์"
      });
      if (!ok) return;
      savePreRolloverSnapshot(state);
      const archived = advanceOneWeek(state, { keepFutureTx: true });
      if (archived) {
        persistAndRender();
        showToast("ปิดสัปดาห์และทบยอดไปสัปดาห์ถัดไปเรียบร้อยแล้ว", "success");
      } else {
        showToast("สัปดาห์นี้ถูกปิดรอบไปแล้ว", "warning");
      }
      break;
    }
    case "reset-week": {
      const ok = await confirmDialog({
        title: "รีเซตรายการสัปดาห์นี้",
        message: "ระบบจะล้างเฉพาะรายการในสัปดาห์ปัจจุบัน โดยยังคงยอดทบยกมา เป้าหมาย และประวัติย้อนหลังไว้ครบถ้วน",
        confirmText: "รีเซตสัปดาห์นี้",
        danger: true
      });
      if (!ok) return;
      resetCurrentWeek(state);
      persistAndRender();
      showToast("รีเซตรายการของสัปดาห์นี้แล้ว", "success");
      break;
    }
    case "restore-rollover-snapshot": {
      const ok = await confirmDialog({
        title: "กู้คืนข้อมูลก่อน Rollover ล่าสุด",
        message: "ต้องการย้อนสถานะกลับไปยังช่วงก่อนเกิดการทบยอดรอบล่าสุดใช่หรือไม่?",
        confirmText: "กู้คืนข้อมูล",
        danger: true
      });
      if (!ok) return;
      const restored = restorePreRolloverSnapshot();
      if (restored) {
        state = restored;
        $("rolloverBanner")?.setAttribute("hidden", "");
        persistAndRender();
        showToast("กู้คืนข้อมูลก่อน Rollover เรียบร้อยแล้ว", "success");
      } else {
        showToast("ไม่พบข้อมูล Snapshot ก่อนหน้า", "warning");
      }
      break;
    }
    case "clear-all": {
      const ok = await confirmDialog({
        title: "ล้างข้อมูลทั้งหมดถาวร",
        message: "การดำเนินการนี้จะลบรายการ ประวัติย้อนหลัง งบประมาณ เป้าหมายการออม และยอดทบทั้งหมดในเครื่องนี้",
        confirmText: "ล้างข้อมูลทั้งหมด",
        danger: true,
        requireText: "DELETE"
      });
      if (!ok) return;
      state = freshState();
      uiState.pendingImport = null;
      $("rolloverBanner")?.setAttribute("hidden", "");
      persistAndRender();
      showToast("ล้างข้อมูลทั้งหมดเรียบร้อยแล้ว", "success");
      break;
    }
  }
}

function bindGlobalEvents() {
  $("mobileMenuBtn")?.addEventListener("click", () => {
    const isOpen = $("sidebar")?.classList.contains("open");
    if (isOpen) closeMobileDrawer();
    else openMobileDrawer();
  });

  $("sidebarBackdrop")?.addEventListener("click", closeMobileDrawer);

  $("sidebarAddTxBtn")?.addEventListener("click", () => {
    closeMobileDrawer();
    openAddTxFlow("expense");
  });
  $("topbarAddTxBtn")?.addEventListener("click", () => openAddTxFlow("expense"));

  const handleThemeToggle = () => {
    const next = uiState.theme === "dark" ? "light" : "dark";
    applyTheme(next);
    if (uiState.activeView === "settings") renderCurrentView();
    showToast(
      next === "dark" ? "เปลี่ยนเป็นโหมดมืด (Dark Mode) แล้ว" : "เปลี่ยนเป็นโหมดสว่าง (Light Mode) แล้ว",
      "info"
    );
  };
  $("sidebarThemeBtn")?.addEventListener("click", handleThemeToggle);
  $("topbarThemeBtn")?.addEventListener("click", handleThemeToggle);

  const handleSyncBtn = () => {
    closeMobileDrawer();
    openSyncModal(syncController, () => renderCurrentView());
  };
  $("sidebarSyncBtn")?.addEventListener("click", handleSyncBtn);
  $("topbarSyncBtn")?.addEventListener("click", handleSyncBtn);

  $("dismissRolloverBtn")?.addEventListener("click", () => {
    const b = $("rolloverBanner");
    if (b) b.hidden = true;
  });

  $("undoRolloverBtn")?.addEventListener("click", async () => {
    const ok = await confirmDialog({
      title: "กู้คืนก่อนทบยอด",
      message: "ต้องการย้อนข้อมูลกลับไปยังสถานะก่อนการทบยอดอัตโนมัติใช่หรือไม่?",
      confirmText: "กู้คืนข้อมูล",
      danger: true
    });
    if (!ok) return;
    const restored = restorePreRolloverSnapshot();
    if (restored) {
      state = restored;
      const b = $("rolloverBanner");
      if (b) b.hidden = true;
      persistAndRender();
      showToast("กู้คืนข้อมูลก่อน Rollover เรียบร้อยแล้ว", "success");
    }
  });

  document.addEventListener("click", (e) => {
    const viewBtn = e.target.closest("[data-view]");
    if (viewBtn) {
      setActiveView(viewBtn.getAttribute("data-view"));
      return;
    }
    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) {
      setActiveView(navBtn.getAttribute("data-nav"));
      return;
    }
    const actionBtn = e.target.closest("[data-action]");
    if (actionBtn) {
      handleActionClick(actionBtn);
    }
  });

  document.addEventListener("change", async (e) => {
    const target = e.target;
    if (target.matches('[data-action="toggle-recurring"]')) {
      const id = target.getAttribute("data-id");
      toggleRecurring(state, id);
      persistAndRender();
      showToast("อัปเดตสถานะรายการประจำแล้ว", "info");
      return;
    }
    if (target.id === "settingsImportFile") {
      const file = target.files?.[0];
      target.value = "";
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = parseAndValidateBackup(text);
        if (!parsed.ok) {
          showToast(parsed.error || "ไฟล์สำรองข้อมูลไม่ถูกต้อง", "error");
          return;
        }
        uiState.pendingImport = {
          state: parsed.state,
          summary: parsed.summary,
          fileName: file.name
        };
        renderCurrentView();
        showToast("อ่านไฟล์สำรองสำเร็จ กรุณาตรวจสอบและกดยืนยันกู้คืน", "info");
      } catch {
        showToast("ไม่สามารถอ่านไฟล์สำรองข้อมูลได้", "error");
      }
    }
  });

  document.addEventListener("submit", (e) => {
    const form = e.target;
    if (form.id === "weeklyBudgetForm") {
      e.preventDefault();
      const input = form.querySelector("#weeklyBudgetInput");
      const val = Number(input?.value || 0);
      if (!Number.isFinite(val) || val < 0) {
        showToast("กรุณากรอกวงเงินตั้งแต่ 0 ขึ้นไป", "warning");
        return;
      }
      state.weeklyBudget = val > 0 ? r2(val) : 0;
      persistAndRender();
      showToast(
        state.weeklyBudget > 0 ? "บันทึกงบประมาณรายสัปดาห์แล้ว" : "ยกเลิกวงเงินงบประมาณรายสัปดาห์แล้ว",
        "success"
      );
      return;
    }
    if (form.id === "monthlyBudgetForm") {
      e.preventDefault();
      const input = form.querySelector("#monthlyBudgetInput");
      const val = Number(input?.value || 0);
      if (!Number.isFinite(val) || val < 0) {
        showToast("กรุณากรอกวงเงินตั้งแต่ 0 ขึ้นไป", "warning");
        return;
      }
      state.monthlyBudget = val > 0 ? r2(val) : 0;
      persistAndRender();
      showToast(
        state.monthlyBudget > 0 ? "บันทึกงบประมาณรายเดือนแล้ว" : "ยกเลิกวงเงินงบประมาณรายเดือนแล้ว",
        "success"
      );
      return;
    }
    if (form.id === "addCategoryForm") {
      e.preventDefault();
      const type = form.querySelector("#newCatType")?.value || "expense";
      const nameInput = form.querySelector("#newCatName");
      const name = String(nameInput?.value || "").trim();
      if (!name) {
        showToast("กรุณากรอกชื่อหมวดหมู่", "warning");
        return;
      }
      addCategoryToState(type, name);
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      runLifecycleChecks();
      const cfg = syncController?.getConfig?.();
      if (cfg?.token) {
        syncController.syncWithCloud(true);
      }
    }
  });

  bindChartTooltips(document);

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && $("sidebar")?.classList.contains("open")) {
      closeMobileDrawer();
    }
  });
}

function init() {
  applyTheme(loadTheme());
  const loaded = loadState();
  state = loaded.state;

  syncController = createSyncController({
    getState: () => state,
    onRemoteState: (remoteRaw) => {
      state = sanitizeState(remoteRaw);
      persistAndRender({ skipCloud: true });
      runLifecycleChecks({ skipCloud: true });
    },
    onStatusChange: updateSyncBadges,
    onToast: (msg) => showToast(msg, "info")
  });

  const cfg = syncController.getConfig();
  updateSyncBadges(cfg.token ? "synced" : "", cfg.token ? "เชื่อมต่อ GitHub แล้ว" : "", cfg);

  bindGlobalEvents();
  runLifecycleChecks();
  setActiveView("dashboard");

  if (loaded.migratedFromLegacy) {
    showToast("โอนย้ายข้อมูลจากเวอร์ชันเดิมเข้าสู่ระบบใหม่เรียบร้อยแล้ว", "success");
  }
  if (cfg.token) {
    syncController.syncWithCloud(true);
  }
}

init();
